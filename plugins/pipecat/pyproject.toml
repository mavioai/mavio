[project]
name = "mavio-pipecat"
version = "0.0.0"
description = "Voice sessions of the Mavio assistant on Pipecat"
license = "GPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pipecat-ai[websocket,whisper,kokoro,openai,deepgram]==1.13.0",
  "mavio-plugin",
  "mavio-proto",
  "httpx>=0.28",
  "uvicorn>=0.37",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14", "pyright>=1.1.406"]

[tool.uv.sources]
mavio-plugin = { workspace = true }
mavio-proto = { workspace = true }

[project.scripts]
mavio-pipecat = "mavio_pipecat.plugin:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.mavio]
# Pure-Python packages without wheels, installed from their source
# distributions when the plugin is packaged; every other dependency
# installs as a wheel.
sdists = ["docopt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
