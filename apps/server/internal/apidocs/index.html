<!doctype html>
<html lang="en">
  <head>
    <title>Mavio API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.70.0"></script>
    <script>
      // The page is served at <base>/api, where the base URL may have a path;
      // requests go to the base.
      const base = location.origin + location.pathname.replace(/\/api\/?$/, '')
      Scalar.createApiReference('#app', {
        url: base + '/api/spec.json',
        servers: [{ url: base }],
        authentication: { preferredSecurityScheme: 'bearer' },
      })
    </script>
  </body>
</html>
