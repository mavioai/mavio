name: Release

# Pushing a tag v<x.y.z> publishes that release of the server: its binaries
# for every platform server:dist builds, with their SHA-256 digests, as a
# GitHub release, and its container image for linux/amd64 and linux/arm64
# as ghcr.io/mavioai/mavio. The plugin catalog is published from it by the
# Release workflow of mavioai/plugins.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

env:
  MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,http:rclone,java,gradle
  IMAGE: ghcr.io/mavioai/mavio

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: ./.github/actions/rust-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run server:dist --skip-nx-cache --output-style=static
        env:
          # The server's, and the web UI's it embeds.
          VERSION: ${{ github.ref_name }}
          MAVIO_VERSION: ${{ github.ref_name }}
      - name: Publish the release
        working-directory: apps/server/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum mavio-*.tar.gz mavio-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # A version with a pre-release part, such as v0.2.0-rc.1, is a
          # pre-release, which /releases/latest leaves out.
          pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Mavio $TAG" $pre \
            mavio-*.tar.gz mavio-*.zip SHA256SUMS.txt

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push for amd64 and arm64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version without its v, and latest unless it is a pre-release.
          tags="-t $IMAGE:${TAG#v}"
          case "$TAG" in *-*) ;; *) tags="$tags -t $IMAGE:latest" ;; esac
          docker buildx build -f apps/server/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$TAG" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="${TAG#v}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses=GPL-3.0-only \
            $tags --push .
