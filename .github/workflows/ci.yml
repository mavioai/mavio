name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the media job needs ffmpeg, and only the android job Java and Gradle;
# they install them from mise.toml.
env:
  MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,http:rclone,java,gradle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Finds what a change affects, so that the jobs of what it does not affect
  # are skipped. A change to the CI or the toolchain affects every project,
  # as does a run started by hand.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.affected.outputs.all }}
      apple: ${{ steps.affected.outputs.apple }}
      android: ${{ steps.affected.outputs.android }}
      server: ${{ steps.affected.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - id: affected
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git diff --quiet "$NX_BASE" "$NX_HEAD" -- .github mise.toml; then
            all=false affected=--affected
          else
            all=true affected=
          fi
          {
            echo "all=$all"
            apple=$(pnpm exec nx show projects $affected --projects tag:platform:apple --json)
            # The apple jobs, one per platform with the affected projects it
            # builds.
            echo "apple=$(jq -c '. as $a | [
                {name: "macOS", platforms: "macos", projects: ["apple", "macos"]},
                {name: "iOS", platforms: "ios-sim", projects: ["ios"]},
                {name: "tvOS", platforms: "tvos-sim", projects: ["tvos"]}
              ] | map(.projects |= map(select(IN($a[])))) | map(select(.projects != []))' <<< "$apple")"
            echo "android=$(pnpm exec nx show projects $affected --projects tag:platform:android --json)"
            # The media, dist and image jobs build and test the server.
            echo "server=$(pnpm exec nx show projects $affected --projects server,media,streaming,fixtures --json | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Lint, test, build (affected)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # Rust comes from libs/client-rust/rust-toolchain.toml through rustup.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs/client-rust
            libs/intent
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - uses: ./.github/actions/go-cache
        with:
          key: check
          lint: true
      # The Apple and Android projects build in jobs of their own, which run
      # when they are affected.
      - run: pnpm nx ${{ needs.plan.outputs.all == 'true' && 'run-many' || 'affected' }} -t buf-lint lint tidy-check typecheck build test --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
      - name: Generated code is up to date
        run: |
          pnpm nx run-many -t generate --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
          git diff --exit-code
      - name: Protobuf breaking changes
        if: github.event_name == 'pull_request'
        working-directory: libs/proto
        run: buf breaking --against "${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=libs/proto"
      - uses: ./.github/actions/go-cache
        with:
          key: check
          lint: true
          save: true

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs/client-rust
            libs/intent
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/go-cache
        with:
          key: test
      # Pull requests test the affected projects; main tests every project.
      - if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v4
      - run: pnpm nx ${{ github.event_name == 'pull_request' && needs.plan.outputs.all != 'true' && 'affected' || 'run-many' }} -t typecheck test build --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
      - uses: ./.github/actions/go-cache
        with:
          key: test
          save: true

  # A job per platform, so that the builds do not share a runner's cores.
  apple:
    name: Apple (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.apple != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apple) }}
    # Xcode 27, which the Package.resolved files are made with: SwiftPM
    # resolves some packages differently with older Swift.
    runs-on: xcode-27
    # A hung build stops at the cap.
    timeout-minutes: 60
    env:
      MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,http:rclone,java,gradle
      # The core built without optimizations, which take most of its time.
      MAVIO_CORE_PROFILE: dev
      # The core and the macOS app for Apple silicon only, as the runner is.
      MAVIO_MACOS_ARCHS: arm64
      # The core for the platform of the job, a simulator or macOS, which
      # its builds and tests run on; no device.
      MAVIO_APPLE_PLATFORMS: ${{ matrix.platforms }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs/client-rust
            libs/intent
          # The key changes with the profile and the platforms, whose builds
          # the cache keeps.
          key: ${{ env.MAVIO_CORE_PROFILE }}-${{ matrix.platforms }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The clones of the Swift packages, which SwiftPM and xcodebuild share.
      - id: swiftpm
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('libs/apple/Package.resolved', 'apps/*/Mavio.xcodeproj/**/Package.resolved') }}
          restore-keys: swiftpm-
      # The downloads of the prebuilt libraries from mavio-deps, which
      # tools/deps/fetch.sh checks and keeps in dist/deps, so that a run
      # does not depend on GitHub's release downloads.
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: dist/deps
          key: deps-apple-${{ hashFiles('tools/deps/deps.txt') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint build test --projects '${{ join(matrix.projects, ',') }}' --output-style=static
      - if: github.ref == 'refs/heads/main' && steps.swiftpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: dist/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Generated projects are up to date
        run: |
          pnpm nx run-many -t generate --projects '${{ join(matrix.projects, ',') }}' --output-style=static
          git diff --exit-code

  android:
    name: Android
    needs: plan
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,http:rclone
      # The core built without optimizations, which take most of its time.
      MAVIO_CORE_PROFILE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            libs/client-rust
            libs/intent
          # The key changes with the profile, whose builds the cache keeps.
          key: ${{ env.MAVIO_CORE_PROFILE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Caches Gradle's home: the dependencies, and the outputs of the build
      # cache that gradle.properties enables. Only main writes it.
      - uses: gradle/actions/setup-gradle@v4
      # The downloads of the prebuilt libraries from mavio-deps, which
      # tools/deps/fetch.sh checks and keeps in dist/deps, so that a run
      # does not depend on GitHub's release downloads.
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: dist/deps
          key: deps-android-${{ hashFiles('tools/deps/deps.txt') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint build test --projects '${{ join(fromJSON(needs.plan.outputs.android), ',') }}' --output-style=static
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: dist/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

  media:
    name: Media integration (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_DISABLE_TOOLS: java,gradle
      # Go's cached test results would replay too.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: ffmpeg -version | head -1
      - run: rclone version | head -1
      - uses: ./.github/actions/go-cache
        with:
          key: media
      - run: pnpm nx run fixtures:media --output-style=static
      # Real ffmpeg runs on the runner's hardware; the cache would replay
      # results from runs without fixtures.
      - run: pnpm nx run-many -t test -p media streaming rclone server --skip-nx-cache --output-style=static
      - uses: ./.github/actions/go-cache
        with:
          key: media
          save: true

  dist:
    name: Cross-compile
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/go-cache
        with:
          key: dist
      - run: pnpm nx run server:dist --output-style=static
        env:
          VERSION: ${{ github.sha }}
      - uses: ./.github/actions/go-cache
        with:
          key: dist
          save: true

  image:
    name: Container image
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64
        run: docker buildx build -f apps/server/Dockerfile --platform linux/amd64,linux/arm64 --build-arg VERSION="${GITHUB_SHA::12}" .
      - name: Run the amd64 image
        run: |
          docker buildx build -f apps/server/Dockerfile --platform linux/amd64 --build-arg VERSION="${GITHUB_SHA::12}" -t mavio:ci --load .
          docker run -d --name mavio --health-interval 2s mavio:ci
          for _ in $(seq 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' mavio)" = healthy ] && break
            sleep 2
          done
          docker logs mavio
          [ "$(docker inspect --format '{{.State.Health.Status}}' mavio)" = healthy ]
          docker exec mavio mavio version
          docker exec mavio /usr/lib/jellyfin-ffmpeg/ffmpeg -version

  # Deletes the caches of main that newer caches replaced: the caches a job
  # saved for earlier commits, and those of earlier toolchains.
  caches:
    name: Prune caches
    needs: [check, test, apple, android, media, dist]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Newest first; a key without its trailing hashes names what the
          # cache is for, and only the newest cache of each is kept.
          gh cache list --ref refs/heads/main --sort created_at --order desc --limit 100 --json id,key \
            --jq '.[] | "\(.id) \(.key)"' |
            awk '{
              n = split($2, part, "-")
              drop = $2 ~ /^v0-rust-/ ? 2 : $2 ~ /^(go|mise-v0|swiftpm|gradle-home)-/ ? 1 : 0
              if (!drop) next
              what = part[1]; for (i = 2; i <= n - drop; i++) what = what "-" part[i]
              if (seen[what]++) print $1
            }' |
            xargs -r -n1 gh cache delete
