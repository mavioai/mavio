name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the media job needs ffmpeg, only the android job Java and Gradle, and
# only the android and apple jobs meson and ninja; they install them from
# mise.toml.
env:
  MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,java,gradle,meson,ninja

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Finds what a change affects, so that the jobs of what it does not affect
  # are skipped. A change to the CI or the toolchain affects every project.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.affected.outputs.all }}
      apple: ${{ steps.affected.outputs.apple }}
      android: ${{ steps.affected.outputs.android }}
      web: ${{ steps.affected.outputs.web }}
      server: ${{ steps.affected.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - id: affected
        run: |
          if git diff --quiet "$NX_BASE" "$NX_HEAD" -- .github mise.toml; then
            all=false affected=--affected
          else
            all=true affected=
          fi
          {
            echo "all=$all"
            for p in apple android; do
              echo "$p=$(pnpm exec nx show projects $affected --projects "tag:platform:$p" --json)"
            done
            echo "web=$(pnpm exec nx show projects $affected --projects web --json | jq 'length > 0')"
            # The media, dist and image jobs build and test the server.
            echo "server=$(pnpm exec nx show projects $affected --projects server,media,streaming,fixtures --json | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Lint, test, build (affected)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # Rust comes from libs/client-rust/rust-toolchain.toml through rustup.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/client-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - uses: ./.github/actions/go-cache
        with:
          key: check
          lint: true
      # The Apple and Android projects build in jobs of their own, which run
      # when they are affected.
      - run: pnpm nx ${{ needs.plan.outputs.all == 'true' && 'run-many' || 'affected' }} -t buf-lint lint tidy-check typecheck build test --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
      - name: Generated code is up to date
        run: |
          pnpm nx run-many -t generate --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
          git diff --exit-code
      - name: Protobuf breaking changes
        if: github.event_name == 'pull_request'
        working-directory: libs/proto
        run: buf breaking --against "${{ github.server_url }}/${{ github.repository }}.git#branch=${{ github.base_ref }},subdir=libs/proto"
      - uses: ./.github/actions/go-cache
        with:
          key: check
          lint: true
          save: true

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/client-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/go-cache
        with:
          key: test
      # Pull requests test the affected projects; main tests every project.
      - if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v4
      - run: pnpm nx ${{ github.event_name == 'pull_request' && needs.plan.outputs.all != 'true' && 'affected' || 'run-many' }} -t typecheck test build --exclude 'tag:platform:apple,tag:platform:android' --output-style=static
      - uses: ./.github/actions/go-cache
        with:
          key: test
          save: true

  apple:
    name: Apple
    needs: plan
    if: needs.plan.outputs.apple != '[]'
    runs-on: macos-latest
    # A hung build stops at the cap.
    timeout-minutes: 60
    env:
      # meson and ninja build libass.
      MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,java,gradle
      # The core built without optimizations, which take most of its time.
      MAVIO_CORE_PROFILE: dev
      # The core and the macOS app for Apple silicon only, as the runner is.
      MAVIO_MACOS_ARCHS: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/client-rust
          # The key changes with the profile, whose builds the cache keeps.
          key: ${{ env.MAVIO_CORE_PROFILE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The clones of the Swift packages, which SwiftPM and xcodebuild share.
      - id: swiftpm
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('libs/apple/Package.resolved', 'apps/*/Mavio.xcodeproj/**/Package.resolved') }}
          restore-keys: swiftpm-
      - run: pnpm install --frozen-lockfile
      # libass, rebuilt only when its build script, which pins every
      # version, changes.
      - uses: actions/cache@v4
        with:
          path: |
            libs/apple/build/Libass.xcframework
            libs/apple/build/libass/stamp
          key: libass-${{ env.MAVIO_MACOS_ARCHS }}-${{ hashFiles('libs/apple/scripts/build-ass.sh') }}
      - run: pnpm nx run-many -t lint build test --projects '${{ join(fromJSON(needs.plan.outputs.apple), ',') }}' --output-style=static
      # The snapshot tests on the iOS simulator (docs/clients.md §6.8).
      - if: contains(fromJSON(needs.plan.outputs.apple), 'apple')
        run: pnpm nx run apple:snapshot --output-style=static
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-ios
          path: libs/apple/build/snapshots/*.png
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main' && steps.swiftpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}
      - name: Generated projects are up to date
        run: |
          pnpm nx run-many -t generate --projects '${{ join(fromJSON(needs.plan.outputs.apple), ',') }}' --output-style=static
          git diff --exit-code

  android:
    name: Android
    needs: plan
    if: needs.plan.outputs.android != '[]'
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg
      # The core built without optimizations, which take most of its time.
      MAVIO_CORE_PROFILE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/client-rust
          # The key changes with the profile, whose builds the cache keeps.
          key: ${{ env.MAVIO_CORE_PROFILE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Caches Gradle's home: the dependencies, and the outputs of the build
      # cache that gradle.properties enables. Only main writes it.
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # libmpv takes an hour to build; it is rebuilt only when its build
      # script, which pins every version, changes.
      - id: mpv
        uses: actions/cache@v4
        with:
          path: libs/android/player/build/mpv
          key: mpv-${{ hashFiles('libs/android/scripts/build-mpv.sh') }}
      - if: steps.mpv.outputs.cache-hit != 'true'
        run: sudo apt-get install -y autoconf automake libtool pkg-config gperf nasm
      # Media3's FFmpeg extension, rebuilt when its script or Media3 changes.
      - uses: actions/cache@v4
        with:
          path: libs/android/player/build/ffmpeg
          key: ffmpeg-${{ hashFiles('libs/android/scripts/build-ffmpeg.sh', 'libs/android/gradle/libs.versions.toml') }}
      - run: pnpm nx run-many -t lint build test --projects '${{ join(fromJSON(needs.plan.outputs.android), ',') }}' --output-style=static
      # The tests compare the snapshots with their references; the images
      # of a failed comparison.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-android
          path: libs/android/ui/build/outputs/roborazzi
          if-no-files-found: ignore

  # The snapshot tests of the web UI (docs/clients.md §6.8), in the browser of
  # Playwright's image on arm64, as they are recorded on Apple silicon; the
  # results of a failed comparison, and the gallery of every client's
  # references.
  web-snapshots:
    name: Web snapshots
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      MISE_DISABLE_TOOLS: github:jellyfin/jellyfin-ffmpeg,java,gradle
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run web:snapshot --output-style=static
      - if: always()
        run: pnpm nx run design:gallery --output-style=static
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: dist/snapshots
          if-no-files-found: ignore

  media:
    name: Media integration (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_DISABLE_TOOLS: java,gradle,meson,ninja
      # Go's cached test results would replay too.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: ffmpeg -version | head -1
      - uses: ./.github/actions/go-cache
        with:
          key: media
      - run: pnpm nx run fixtures:media --output-style=static
      # Real ffmpeg runs on the runner's hardware; the cache would replay
      # results from runs without fixtures.
      - run: pnpm nx run-many -t test -p media streaming server --skip-nx-cache --output-style=static
      - uses: ./.github/actions/go-cache
        with:
          key: media
          save: true

  dist:
    name: Cross-compile
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/go-cache
        with:
          key: dist
      - run: pnpm nx run server:dist --output-style=static
        env:
          VERSION: ${{ github.sha }}
      - uses: ./.github/actions/go-cache
        with:
          key: dist
          save: true

  image:
    name: Container image
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64
        run: docker buildx build -f apps/server/Dockerfile --platform linux/amd64,linux/arm64 --build-arg VERSION="${GITHUB_SHA::12}" .
      - name: Run the amd64 image
        run: |
          docker buildx build -f apps/server/Dockerfile --platform linux/amd64 --build-arg VERSION="${GITHUB_SHA::12}" -t mavio:ci --load .
          docker run -d --name mavio --health-interval 2s mavio:ci
          for _ in $(seq 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' mavio)" = healthy ] && break
            sleep 2
          done
          docker logs mavio
          [ "$(docker inspect --format '{{.State.Health.Status}}' mavio)" = healthy ]
          docker exec mavio mavio version
          docker exec mavio /usr/lib/jellyfin-ffmpeg/ffmpeg -version

  # Deletes the caches of main that newer caches replaced: the caches a job
  # saved for earlier commits, and those of earlier toolchains.
  caches:
    name: Prune caches
    needs: [check, test, apple, android, media, dist]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Newest first; a key without its trailing hashes names what the
          # cache is for, and only the newest cache of each is kept.
          gh cache list --ref refs/heads/main --sort created_at --order desc --limit 100 --json id,key \
            --jq '.[] | "\(.id) \(.key)"' |
            awk '{
              n = split($2, part, "-")
              drop = $2 ~ /^v0-rust-/ ? 2 : $2 ~ /^(go|mise-v0|swiftpm|gradle-home|mpv|ffmpeg|libass)-/ ? 1 : 0
              if (!drop) next
              what = part[1]; for (i = 2; i <= n - drop; i++) what = what "-" part[i]
              if (seen[what]++) print $1
            }' |
            xargs -r -n1 gh cache delete
