  no_ai: "AI 없이는 간단한 것만 할 수 있어요. 예를 들면:"
  failed: 문제가 생겼어요.
  help: "이렇게 말해 보세요:"
  listening: 듣고 있어요…
  more: 더 있어요.
  no_more: 이게 다예요.
  hours: "{n}시간"
  minutes: "{n}분"
  seconds: "{n}초"

examples:
  - 일시정지
  - 30초 뒤로
  - 영어 자막 켜줘
  - 오징어 게임 2화 틀어줘
  - 이어서 보기
  - 이거 뭐야
  - 누가 나와
  - 얼마나 남았어
  - 오프닝 건너뛰어
  - 1.5배속으로 재생해
