[workspace]

[workspace.metadata.nx]
implicitDependencies = ["proto"]

[package]
name = "mavio-intent"
description = "The assistant's grammar: what a request's text means, in every language it has a grammar for"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[lib]
# cdylib is the WASM module the web UI and the server run; rlib the tests'.
crate-type = ["cdylib", "rlib"]
# The generated code's doc comments quote the .proto files, not Rust.
doctest = false

[dependencies]
buffa = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
