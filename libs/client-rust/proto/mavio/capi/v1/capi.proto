// The messages of the core's C ABI (libs/client-rust/capi), through which
// the desktop app calls the core: the app sends a Request with a
// call number, and the core answers each with a Message of that number
// through the one callback the app gave it, which also carries the events
// of the servers under call number zero. A call answered in parts, such as
// LoadHome, sends Messages marked more before its last one.
edition = "2023";

package mavio.capi.v1;

option features.field_presence = IMPLICIT;

// A call of the app.
message Request {
  oneof kind {
    Open open = 1;
    GetVersion get_version = 2;
    Probe probe = 3;
    SignIn sign_in = 4;
    Start start = 5;
    Stop stop = 6;
    ListServers list_servers = 7;
    CreateFirstUser create_first_user = 8;
    Discover discover = 9;
    RemoveServer remove_server = 10;
    OrderServers order_servers = 11;
    StartQuickConnect start_quick_connect = 12;
    PollQuickConnect poll_quick_connect = 13;
    CancelQuickConnect cancel_quick_connect = 14;
    AuthorizeQuickConnect authorize_quick_connect = 15;
    LoadHome load_home = 16;
    GetHub get_hub = 17;
    GetRecommended get_recommended = 18;
    ListLibraries list_libraries = 19;
    ListLibraryItems list_library_items = 20;
    GetDetails get_details = 21;
    SetPlayed set_played = 22;
    SetFavorite set_favorite = 23;
    Search search = 24;
    Play play = 25;
    UpdatePlayback update_playback = 26;
    StopPlayback stop_playback = 27;
    StartAccountSignIn start_account_sign_in = 28;
    FinishAccountSignIn finish_account_sign_in = 29;
    CancelAccountSignIn cancel_account_sign_in = 30;
    StartLink start_link = 31;
    PollLink poll_link = 32;
    CancelLink cancel_link = 33;
    GetAccount get_account = 34;
    SyncAccount sync_account = 35;
    SignOut sign_out = 36;
    CallServer call_server = 37;
    SearchServer search_server = 38;
    SwitchUser switch_user = 39;
    CallServerStream call_server_stream = 40;
    RunIntent run_intent = 41;
    SetLanguages set_languages = 42;
  }
}

// Calls a unary procedure of a server signed in to, for the screens the
// core does not model, such as a person or the settings: the core sends
// it as the session and answers with its response, encoded as protobuf.
message CallServer {
  string server_id = 1;
  // The procedure's path, such as "/mavio.library.v1.ItemService/GetItem".
  string procedure = 2;
  // The request, encoded as protobuf.
  bytes request = 3;
}

// Calls a server-streaming procedure of a server signed in to, such as
// the assistant's Ask, as CallServer calls a unary one: answered with a
// ServerResponse for each message of the stream, each but the last
// marked more, then Done.
message CallServerStream {
  string server_id = 1;
  // The procedure's path, such as "/mavio.assistant.v1.AssistantService/Ask".
  string procedure = 2;
  // The request, encoded as protobuf.
  bytes request = 3;
}

// Runs a function of the assistant's grammar (libs/intent), the fast path
// of docs/assistant.md §4, answered with a ServerResponse whose body is
// the answer.
message RunIntent {
  // The function: "parse" takes a mavio.intent.v1.ParseIntentRequest,
  // "reply" a ReplyRequest and "examples" an ExamplesRequest.
  string function = 1;
  // The function's request, encoded as protobuf.
  bytes request = 2;
}

// Sets the languages the app is shown in, most wanted first, as BCP 47
// tags such as "zh-Hans", which every call to a server asks for in its
// Accept-Language header; none asks for none. Answered with Done.
message SetLanguages {
  repeated string tags = 1;
}

// A CallServer's response.
message ServerResponse {
  // The response, encoded as protobuf.
  bytes body = 1;
  // The server's base URL the core reached it at, which the paths the
  // response holds, such as the signed URLs of images, are relative to.
  string base_url = 2;
}

// Opens the core, before any other call.
message Open {
  // The offline store's database.
  string database_path = 1;
  Device device = 2;
  // The secrets the app keeps for the core: the credentials of each
  // server's session, by server ID, and the device key, under
  // "device-key". TokenChanged tells it of new and forgotten ones.
  map<string, string> tokens = 3;
}

// The device, as servers list it.
message Device {
  // Stable for the installation.
  string id = 1;
  // Shown to the user, such as "Living room PC".
  string name = 2;
  // The app, such as "Mavio for Windows".
  string client = 3;
  string client_version = 4;
}

// Answered with the version of the core.
message GetVersion {}

// Asks the server at an address who it is; answered with its ServerInfo.
message Probe {
  string address = 1;
}

// Signs in to a server, adding it; answered with its ServerRecord.
message SignIn {
  string address = 1;
  string name = 2;
  string password = 3;
}

// Follows the event streams of the signed-in servers.
message Start {}

// Stops the event streams.
message Stop {}

// Answered with the servers, in the user's order.
message ListServers {}

// Creates the first user of a new server and signs in as them; answered
// with its ServerRecord.
message CreateFirstUser {
  string address = 1;
  string name = 2;
  string password = 3;
}

// Finds the servers on the local network that answer within wait_ms;
// answered with FoundServers.
message Discover {
  uint32 wait_ms = 1;
}

// Signs out of a server and forgets it.
message RemoveServer {
  string server_id = 1;
}

// Switches a standalone server's session to another of its users, whom
// AuthService's ListSwitchableUsers lists, with their PIN when they have
// one; answered with its ServerRecord, of the user switched to.
message SwitchUser {
  string server_id = 1;
  string user_id = 2;
  // Empty for a user without a PIN.
  string pin = 3;
}

// Orders the servers as the user arranged them.
message OrderServers {
  repeated string server_ids = 1;
}

// Starts signing in to the server at an address with Quick Connect;
// answered with a QuickConnect.
message StartQuickConnect {
  string address = 1;
}

// Asks whether a Quick Connect request was authorized: answered with the
// ServerRecord signed in to once it was, which ends the request, or with
// Done while it waits.
message PollQuickConnect {
  uint64 request = 1;
}

// Gives up a Quick Connect request.
message CancelQuickConnect {
  uint64 request = 1;
}

// Authorizes another device's Quick Connect code on a server this device
// is signed in to.
message AuthorizeQuickConnect {
  string server_id = 1;
  string code = 2;
}

// Starts signing a Mavio account in in the browser, at the mavio.dev whose
// API is api, as client_id, such as dev.mavio.desktop: answered with an
// AccountSignIn, whose page the app opens.
message StartAccountSignIn {
  string api = 1;
  string client_id = 2;
}

// Waits for the browser to come back from a sign-in, then signs the
// account in and follows its servers: answered with the Account, or with
// CODE_PERMISSION_DENIED when the account declined.
message FinishAccountSignIn {
  uint64 request = 1;
}

// Gives up a sign-in in the browser; its FinishAccountSignIn answers
// CODE_NOT_FOUND.
message CancelAccountSignIn {
  uint64 request = 1;
}

// Starts signing a Mavio account in with a link code, at the mavio.dev
// whose API is api, as client_id: answered with a LinkCode.
message StartLink {
  string api = 1;
  string client_id = 2;
}

// Asks whether a link code was approved: answered with the Account signed
// in once it was, after following its servers, which ends the request, or
// with Done while it waits; an expired code is CODE_NOT_FOUND.
message PollLink {
  uint64 request = 1;
}

// Gives up a link code.
message CancelLink {
  uint64 request = 1;
}

// Answered with the Mavio account signed in, whose id is empty without
// one.
message GetAccount {}

// Follows the Mavio account's servers now.
message SyncAccount {}

// Signs out of the Mavio account and its servers, or of every server
// signed in to without one, forgetting them.
message SignOut {}

// Loads Home from every server at once: answered with Rows, all of them,
// each time a server answers, marked more, then with Done.
message LoadHome {}

// More items of a row; answered with a Page.
message GetHub {
  string server_id = 1;
  string hub_id = 2;
  uint32 offset = 3;
  uint32 limit = 4;
}

// A library's Recommended tab; answered with Rows.
message GetRecommended {
  string server_id = 1;
  string library_id = 2;
}

// A server's libraries; answered with Libraries.
message ListLibraries {
  string server_id = 1;
}

// A page of a library's grid; answered with a Page.
message ListLibraryItems {
  string server_id = 1;
  string library_id = 2;
  Sort sort = 3;
  Filter filter = 4;
  uint32 offset = 5;
  uint32 limit = 6;
}

// How a library's grid is sorted.
enum Sort {
  // By name.
  SORT_UNSPECIFIED = 0;
  // Last added first.
  SORT_DATE_ADDED = 1;
  // Last released first.
  SORT_RELEASED = 2;
  // Best rated first.
  SORT_RATING = 3;
  // Last played first.
  SORT_LAST_PLAYED = 4;
  SORT_RANDOM = 5;
}

// A library's grid filter.
message Filter {
  // Only played (true) or unplayed (false) items.
  bool played = 1 [features.field_presence = EXPLICIT];
  // Only favorites.
  bool favorite = 2;
  // Only items of this genre.
  string genre = 3;
  // Only items with this keyword.
  string tag = 4;
  // Only items of this studio or network.
  string studio = 5;
}

// An item's details; answered with Details.
message GetDetails {
  string server_id = 1;
  string item_id = 2;
}

// Marks an item played or unplayed.
message SetPlayed {
  string server_id = 1;
  string item_id = 2;
  bool played = 3;
}

// Marks an item a favorite or not.
message SetFavorite {
  string server_id = 1;
  string item_id = 2;
  bool favorite = 3;
}

// Searches every server at once; answered with SearchResults.
message Search {
  string query = 1;
}

// Searches one server, for screens that show each server's results as it
// answers; answered with SearchResults of that server, its error in them.
message SearchServer {
  string server_id = 1;
  string query = 2;
}

// Starts playing an item; answered with a Playback, whose session the app
// updates and stops.
message Play {
  string server_id = 1;
  string item_id = 2;
  // What the player plays: an encoded mavio.playback.v1.ClientCapabilities.
  bytes capabilities = 3;
  PlaybackOptions options = 4;
}

// What to play of an item.
message PlaybackOptions {
  // The media source; empty picks the best one for the client.
  string media_source_id = 1;
  // The audio stream; unset plays the user's or the source's default.
  int32 audio_stream_index = 2 [features.field_presence = EXPLICIT];
  // The subtitle stream, -1 for none; unset plays the user's or the
  // source's default.
  int32 subtitle_stream_index = 3 [features.field_presence = EXPLICIT];
  // Caps the bitrate, in bits per second; zero for none.
  int64 max_bitrate = 4;
  // Where to begin, usually the resume position.
  int64 start_position_ms = 5 [features.field_presence = EXPLICIT];
}

// The player's position and whether it is paused; sent on every tick, it
// reports every ten seconds and on pause and seek.
message UpdatePlayback {
  uint64 session = 1;
  int64 position_ms = 2;
  bool paused = 3;
}

// Playback stopped, which ends the session.
message StopPlayback {
  uint64 session = 1;
  // Where it stopped; unset when played to the end.
  int64 position_ms = 2 [features.field_presence = EXPLICIT];
}

// What the core sends the app: the answer to a call, or an event.
message Message {
  // The call answered; zero for an event.
  uint64 call = 1;
  oneof kind {
    Error error = 2;
    Done done = 3;
    string version = 4;
    ServerInfo server_info = 5;
    ServerRecord server = 6;
    Servers servers = 7;
    Event event = 8;
    FoundServers found_servers = 10;
    QuickConnect quick_connect = 11;
    Rows rows = 12;
    Page page = 13;
    Libraries libraries = 14;
    Details details = 15;
    SearchResults search_results = 16;
    Playback playback = 17;
    Account account = 18;
    AccountSignIn account_sign_in = 19;
    LinkCode link_code = 20;
    ServerResponse response = 21;
  }
  // More Messages answer the call after this one.
  bool more = 9;
}

// Why a call failed.
message Error {
  Code code = 1;
  string reason = 2;

  // The kind of failure.
  enum Code {
    CODE_UNSPECIFIED = 0;
    // The server did not answer; the call may be retried.
    CODE_UNREACHABLE = 1;
    // The server does not know the user or token; they sign in again.
    CODE_UNAUTHENTICATED = 2;
    CODE_PERMISSION_DENIED = 3;
    CODE_NOT_FOUND = 4;
    // The request was wrong, such as a malformed address.
    CODE_INVALID = 5;
    CODE_FAILED_PRECONDITION = 6;
    CODE_SERVER = 7;
    // The offline store failed.
    CODE_STORE = 8;
  }
}

// A call without an answer of its own succeeded.
message Done {}

// A server, as it answered at an address.
message ServerInfo {
  // The server's own ID, the same at every address.
  string id = 1;
  string name = 2;
  string version = 3;
  string address = 4;
  // The server has no user yet, and the first one is created instead of
  // signing in.
  bool setup_required = 5;
  AccountMode mode = 6;
  // The API of the mavio.dev the server's accounts are kept by, in
  // ACCOUNT_MODE_MAVIO_DEV.
  string mavio_dev_url = 7;
}

// Who a server's users are.
enum AccountMode {
  // The server's setup has not chosen yet.
  ACCOUNT_MODE_UNSPECIFIED = 0;
  // The server keeps its own users, who sign in with a password.
  ACCOUNT_MODE_STANDALONE = 1;
  // Every user is a Mavio account, signed in at mavio.dev.
  ACCOUNT_MODE_MAVIO_DEV = 2;
}

// The Mavio account signed in.
message Account {
  string id = 1;
  // Its display name, or its user name without one.
  string name = 2;
  // The API of the mavio.dev it is kept by.
  string api = 3;
}

// A sign-in in the browser.
message AccountSignIn {
  // The request's number, for FinishAccountSignIn.
  uint64 request = 1;
  // The page of mavio.dev to open.
  string url = 2;
}

// A link code to show, with a QR code of verification_uri_complete.
message LinkCode {
  // The request's number, for PollLink.
  uint64 request = 1;
  string user_code = 2;
  // Where to enter the code.
  string verification_uri = 3;
  // The same with the code filled in.
  string verification_uri_complete = 4;
  // When the code expires, in milliseconds since the Unix epoch.
  int64 expires_ms = 5;
  // How often to poll.
  uint32 interval_ms = 6;
}

// A server the device is signed in to.
message ServerRecord {
  string id = 1;
  string address = 2;
  string name = 3;
  string version = 4;
  string user_id = 5;
  string user_name = 6;
  // Whether its address is on the local network: a loopback, private or
  // link-local address, a localhost or .local name, or the s.mavio.fyi
  // name of such an address.
  bool local = 7;
}

// The servers, in the user's order.
message Servers {
  repeated ServerRecord servers = 1;
}

// Servers found on the local network.
message FoundServers {
  repeated FoundServer servers = 1;
}

// A server that answered discovery.
message FoundServer {
  // The server's own ID, the same at every address.
  string id = 1;
  string name = 2;
  // Where it answers, such as "http://192.168.1.5:8686".
  string address = 3;
  string version = 4;
}

// A Quick Connect request: the app shows the code, the user enters it on
// a device signed in to the server, and the app polls the request.
message QuickConnect {
  // The request, to poll or cancel.
  uint64 request = 1;
  // Six digits to show.
  string code = 2;
  // When the request expires, in milliseconds since the Unix epoch.
  int64 expires_ms = 3;
  ServerInfo server = 4;
}

// An image of an item.
message Artwork {
  // The image, to which the app adds "?maxWidth=" and "maxHeight=" for
  // the size it draws.
  string url = 1;
  // Width over height; zero when unknown.
  float aspect = 2;
  // A BlurHash to draw while it loads.
  string blurhash = 3;
}

// What a card stands for.
enum CardKind {
  // Unknown to this version of the core.
  CARD_KIND_UNSPECIFIED = 0;
  CARD_KIND_MOVIE = 1;
  CARD_KIND_SERIES = 2;
  CARD_KIND_SEASON = 3;
  CARD_KIND_EPISODE = 4;
  // A video that is none of the others.
  CARD_KIND_VIDEO = 5;
  CARD_KIND_ARTIST = 6;
  CARD_KIND_ALBUM = 7;
  CARD_KIND_TRACK = 8;
  CARD_KIND_MUSIC_VIDEO = 9;
  CARD_KIND_AUDIOBOOK = 10;
  CARD_KIND_BOOK = 11;
  CARD_KIND_PHOTO_ALBUM = 12;
  CARD_KIND_PHOTO = 13;
  CARD_KIND_FOLDER = 14;
  CARD_KIND_COLLECTION = 15;
  CARD_KIND_PLAYLIST = 16;
}

// The same title on another of the user's servers.
message Version {
  string server_id = 1;
  string item_id = 2;
}

// An item as a card in a row or grid.
message Card {
  string server_id = 1;
  string item_id = 2;
  CardKind kind = 3;
  // Its name; an episode's own name.
  string title = 4;
  // What tells it apart: an episode's series with its numbers, an album's
  // artists.
  string subtitle = 5;
  // Zero when unknown.
  int32 year = 6;
  // The poster, or a square cover.
  Artwork poster = 7;
  // A wide image: the thumbnail, else the first backdrop.
  Artwork thumb = 8;
  // How far the user watched it, from 0 to 1.
  float progress = 9 [features.field_presence = EXPLICIT];
  bool played = 10;
  bool favorite = 11;
  // Its length; zero when unknown.
  int64 runtime_ms = 12;
  // The same title on the user's other servers.
  repeated Version versions = 13;
  // The first backdrop, which Home's hero shows.
  Artwork backdrop = 14;
  // The logo, the title drawn.
  Artwork logo = 15;
  // What it is about.
  string overview = 16;
  repeated string genres = 17;
  // Its parental rating, as "PG-13".
  string official_rating = 18;
}

// A title discovery offers, which no server or only some have.
message TitleCard {
  // Whether it is a movie; else a series.
  bool movie = 1;
  string title = 2;
  // Zero when unknown.
  int32 year = 3;
  string overview = 4;
  // The poster, from the metadata provider.
  string poster_url = 5;
  // A backdrop, from the metadata provider.
  string backdrop_url = 6;
  // Its external IDs, which name it to requests.
  map<string, string> external_ids = 7;
  // Whether the user may request it from the row's server.
  bool requestable = 8;
  // Whether the row's server has requested it.
  bool requested = 9;
  // The servers that have it, whose items play instead.
  repeated Version available = 10;
}

// The kind of a row, which names it.
enum RowKind {
  // A server's place while it loads or is unreachable.
  ROW_KIND_UNSPECIFIED = 0;
  // Items being watched and next episodes.
  ROW_KIND_CONTINUE_WATCHING = 1;
  // Requests that became available.
  ROW_KIND_AVAILABLE_REQUESTS = 2;
  ROW_KIND_RECENTLY_ADDED = 3;
  ROW_KIND_RECENTLY_RELEASED = 4;
  ROW_KIND_RECENTLY_AIRED = 5;
  ROW_KIND_TOP_RATED = 6;
  ROW_KIND_TOP_UNPLAYED = 7;
  // Series not begun.
  ROW_KIND_START_WATCHING = 8;
  // Played long ago.
  ROW_KIND_REDISCOVER = 9;
  // Like an item the user played; the seed names it.
  ROW_KIND_BECAUSE_YOU_WATCHED = 10;
  // Like an item the user favored; the seed names it.
  ROW_KIND_BECAUSE_YOU_LIKE = 11;
  // More in a genre; the seed names it.
  ROW_KIND_MORE_IN_GENRE = 12;
  // Starring a person; the seed names them.
  ROW_KIND_STARRING = 13;
  // Directed by a person; the seed names them.
  ROW_KIND_DIRECTED_BY = 14;
  // Titles discovery offers.
  ROW_KIND_TRENDING = 15;
}

// A row of Home or of a library's Recommended tab.
message Row {
  // Stable across updates, to keep the row's scroll position.
  string id = 1;
  RowKind kind = 2;
  // Its server; empty for Continue Watching across servers.
  string server_id = 3;
  // That server's name, shown when several servers are signed in.
  string server_name = 4;
  // The hub on its server, which GetHub pages.
  string hub_id = 5;
  string library_name = 6;
  // What a seeded row is drawn from: an item, a genre, a person.
  string seed_name = 7;
  // Whether it has more than shown.
  bool more = 8;
  // Whether it comes from the offline store.
  bool offline = 9;
  oneof content {
    Cards items = 10;
    TitleCards titles = 11;
    // Its server has not answered yet.
    Loading loading = 12;
    // Its server is unreachable, with why.
    string unavailable = 13;
  }
}

// The items of a row.
message Cards {
  repeated Card cards = 1;
}

// The titles of a row.
message TitleCards {
  repeated TitleCard titles = 1;
}

// A row waiting for its server.
message Loading {}

// Rows of Home or of a Recommended tab.
message Rows {
  repeated Row rows = 1;
}

// A page of items.
message Page {
  repeated Card cards = 1;
  // The number of items across the pages, when the server counts them.
  uint32 total = 2 [features.field_presence = EXPLICIT];
  // Whether there are items after these.
  bool more = 3;
}

// What a library holds.
enum LibraryType {
  // Anything else.
  LIBRARY_TYPE_UNSPECIFIED = 0;
  LIBRARY_TYPE_MOVIES = 1;
  LIBRARY_TYPE_SHOWS = 2;
  LIBRARY_TYPE_MUSIC = 3;
  LIBRARY_TYPE_MUSIC_VIDEOS = 4;
  LIBRARY_TYPE_HOME_VIDEOS = 5;
  LIBRARY_TYPE_BOOKS = 6;
  LIBRARY_TYPE_PHOTOS = 7;
  LIBRARY_TYPE_COLLECTIONS = 8;
  LIBRARY_TYPE_PLAYLISTS = 9;
}

// A library of a server.
message Library {
  string server_id = 1;
  string id = 2;
  string name = 3;
  LibraryType kind = 4;
  // Its collage.
  string image_url = 5;
}

// The libraries of a server.
message Libraries {
  repeated Library libraries = 1;
  // Whether they come from the offline store.
  bool offline = 2;
}

// A person credited on an item.
message Credit {
  string person_id = 1;
  string name = 2;
  // The character, or their job.
  string role = 3;
  // Whether they act in it; else crew.
  bool cast = 4;
  Artwork photo = 5;
}

// One version of a title: on this server, a file such as "4K HDR"; on
// another server, its copy.
message Source {
  string server_id = 1;
  string server_name = 2;
  string item_id = 3;
  // The media source, for a file of this server.
  string media_source_id = 4;
  // What tells it apart, such as "4K HDR".
  string name = 5;
  // The file's size in bytes; zero when unknown.
  uint64 size = 6;
  // The file's container, such as "mkv", for a file of this server.
  string container = 7;
  // The file's audio streams, for a file of this server.
  repeated AudioStream audio = 8;
  // The file's chapters, in order, for a file of this server.
  repeated Chapter chapters = 9;
}

// A chapter of a file.
message Chapter {
  // Where it starts, in milliseconds.
  int64 start_ms = 1;
  string name = 2;
}

// Thumbnail sheets of one width for seeking: a thumbnail every interval,
// row by row, columns across and rows down a sheet, count in all; sheet n
// is at "{url}/{n}.jpg".
message Trickplay {
  // A thumbnail's width and height, in pixels.
  int32 width = 1;
  int32 height = 2;
  // The thumbnails across and down a sheet.
  int32 columns = 3;
  int32 rows = 4;
  // The thumbnails in all.
  int32 count = 5;
  // The time between thumbnails, in milliseconds.
  int64 interval_ms = 6;
  // The signed URL the sheets are under.
  string url = 7;
}

// An audio stream of a file, to choose it.
message AudioStream {
  // The stream's index in the file.
  int32 index = 1;
  string language = 2;
  string title = 3;
  // Its codec, such as "aac".
  string codec = 4;
  int32 channels = 5;
  bool default = 6;
}

// An item's details.
message Details {
  // The item, as its card.
  Card card = 1;
  string server_name = 2;
  string overview = 3;
  string tagline = 4;
  repeated string genres = 5;
  // Its content rating, such as "PG-13".
  string official_rating = 6;
  // Its community rating, from 0 to 10.
  float community_rating = 7 [features.field_presence = EXPLICIT];
  // When it was first released or aired, in milliseconds since the Unix
  // epoch.
  int64 premiere_ms = 8 [features.field_presence = EXPLICIT];
  Artwork backdrop = 9;
  Artwork logo = 10;
  // Where it resumes; zero for the beginning.
  int64 position_ms = 11;
  // The people credited, cast first.
  repeated Credit credits = 12;
  // Its files on this server, then its copies on the other servers.
  repeated Source sources = 13;
  // Its seasons, episodes or tracks.
  repeated Card children = 14;
  // Items like it.
  repeated Card similar = 15;
  // Whether it comes from the offline store.
  bool offline = 16;
  // Its thumbnail sheets for seeking, one per width.
  repeated Trickplay trickplay = 17;
}

// What every server found, in the user's order of servers.
message SearchResults {
  repeated ServerResults servers = 1;
}

// What one server found.
message ServerResults {
  string server_id = 1;
  string server_name = 2;
  repeated Card cards = 3;
  // Why it could not search.
  string error = 4;
}

// How the server plays an item.
enum PlayKind {
  // The file as it is.
  PLAY_KIND_UNSPECIFIED = 0;
  // The streams copied into a container the client plays.
  PLAY_KIND_DIRECT_STREAM = 1;
  // Re-encoded.
  PLAY_KIND_TRANSCODE = 2;
}

// A playback the server started.
message Playback {
  // The session, to update and stop.
  uint64 session = 1;
  // The media to play: the file, an HLS playlist or a progressive stream.
  string url = 2;
  PlayKind kind = 3;
  // The media source played.
  string media_source_id = 4;
  // Where the media begins; the player starts there.
  int64 start_position_ms = 5 [features.field_presence = EXPLICIT];
  // The audio stream selected.
  int32 audio_stream_index = 6 [features.field_presence = EXPLICIT];
  // The subtitle stream selected, -1 for none.
  int32 subtitle_stream_index = 7 [features.field_presence = EXPLICIT];
  repeated SubtitleTrack subtitles = 8;
}

// A subtitle stream of a playback.
message SubtitleTrack {
  // The stream's index in the media source, to select it.
  int32 stream_index = 1;
  string language = 2;
  string title = 3;
  bool default = 4;
  bool forced = 5;
  // The delivered format, such as "vtt".
  string format = 6;
  // The file of a subtitle delivered on its own; empty when it is in the
  // media.
  string url = 7;
}

// What happened on a server.
message Event {
  string server_id = 1;
  oneof kind {
    StreamState state = 2;
    Connected connected = 3;
    LibraryChanged library_changed = 4;
    UserDataChanged user_data_changed = 5;
    SessionsChanged sessions_changed = 6;
    TokenChanged token_changed = 7;
    ServersChanged servers_changed = 8;
    ScanProgressChanged scan_progress_changed = 9;
  }
}

// The servers changed as the Mavio account's servers were followed; the
// app lists them again. Its server_id is empty.
message ServersChanged {}

// The server's stream came up or went down, or the server signed the
// device out.
message StreamState {
  State state = 1;
  // Why it is offline.
  string reason = 2;

  // The state of a stream.
  enum State {
    STATE_UNSPECIFIED = 0;
    // Connecting, or waiting to reconnect.
    STATE_OFFLINE = 1;
    STATE_ONLINE = 2;
    // The server ended the session; the user signs in again.
    STATE_SIGNED_OUT = 3;
  }
}

// The stream came up; the app reloads what it shows of the server.
message Connected {}

// Items of libraries changed.
message LibraryChanged {
  repeated string library_ids = 1;
  repeated string changed_item_ids = 2;
  repeated string removed_item_ids = 3;
}

// The user's data of items changed, from this device or another.
message UserDataChanged {
  repeated string item_ids = 1;
}

// The sessions of the user's devices changed.
message SessionsChanged {}

// How far a library's scan has come, which the server tells
// administrators at most twice a second while it runs, and once when it
// ends.
message ScanProgressChanged {
  string library_id = 1;
  // Unset once the scan and the work it queued are done.
  ScanProgress progress = 2;
}

// How far a library's scan has come.
message ScanProgress {
  // Whether it reads the library's folders; else it probes the new and
  // changed files and refreshes their items.
  bool reading_folders = 1;
  int32 folders_done = 2;
  int32 folders_total = 3;
  int32 items_done = 4;
  int32 items_total = 5;
  // How far the whole scan has come, from 0 to 1.
  double fraction = 6;
}

// The core has a new secret under the event's server ID, a session's
// credentials or the device key, which the app keeps as it is in the
// system's secure storage, or forgot it when the token is empty.
message TokenChanged {
  string token = 1;
}
