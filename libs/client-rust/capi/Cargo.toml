[package]
name = "mavio-capi"
description = "The C ABI of the Mavio clients' shared core, which the desktop app calls from Go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "maviocore"
crate-type = ["lib", "cdylib"]
# The generated code's doc comments quote the .proto files, not Rust.
doctest = false

[dependencies]
buffa.workspace = true
mavio-api = { path = "../api" }
mavio-core = { path = "../core" }
mavio-intent = { path = "../../intent" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
