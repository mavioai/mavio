[package]
name = "mavio-core"
description = "The shared core of the Mavio clients: servers, sign-in, events, offline store, playback reporting, downloads and screen state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
buffa.workspace = true
bytes = "1"
connectrpc = { workspace = true, features = ["client", "client-tls"] }
http = "1"
http-body-util = "0.1"
hyper = "1"
mavio-api = { path = "../api" }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
webpki-roots = "1"

[dev-dependencies]
buffa-types.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
