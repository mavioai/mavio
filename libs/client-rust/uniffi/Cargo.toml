[package]
name = "mavio-uniffi"
description = "The Swift and Kotlin API of the Mavio clients' shared core, exported with UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mavio"
# A shared library, for the Apple frameworks and for Android: it keeps its
# Rust standard library to itself, which a static library would clash with
# the other Rust static libraries of an app (AetherEngine's LibDovi).
crate-type = ["lib", "cdylib"]

[dependencies]
mavio-core = { path = "../core" }
uniffi.workspace = true

[lints]
workspace = true
