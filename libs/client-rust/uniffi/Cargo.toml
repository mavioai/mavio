[package]
name = "mavio-uniffi"
description = "The Swift and Kotlin API of the Mavio clients' shared core, exported with UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mavio"
# A static library for the Apple XCFramework, a shared one for Android.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# Generates the Swift and Kotlin sources from the built library.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
mavio-core = { path = "../core" }
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true
