version: v2
clean: true
managed:
  enabled: true
  disable:
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/mavioai/mavio/libs/proto/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt:
      - paths=source_relative
      - simple
  # TypeScript for the web UI (libs/client-ts): messages and service
  # descriptors of protobuf-es, which connect-es uses directly; the imported
  # protovalidate options are generated too, as the descriptors import them.
  - local: node_modules/.bin/protoc-gen-es
    out: gen/ts
    include_imports: true
    opt:
      - target=ts
  # Rust for the shared core (libs/client-rust/api): buffa messages and
  # connect-rust clients, each tree with the mod.rs files of the packaging
  # plugin. The clients find the messages at crate::proto.
  - local: protoc-gen-buffa
    out: gen/rust/proto
    strategy: all
  - local: protoc-gen-buffa-packaging
    out: gen/rust/proto
    strategy: all
  - local: protoc-gen-connect-rust
    out: gen/rust/connect
    opt:
      - buffa_module=crate::proto
  - local: protoc-gen-buffa-packaging
    out: gen/rust/connect
    strategy: all
    opt:
      - filter=services
  # One OpenAPI document of the Connect services the server serves, without
  # the plugin contracts, embedded by package openapi and served at
  # /api/spec.json. It runs by version rather than as a tool of this module, so
  # that its dependencies stay out of the module plugins import.
  - local: ["go", "run", "github.com/sudorandom/protoc-gen-connect-openapi@v0.27.3"]
    out: openapi/gen
    strategy: all
    opt:
      - base=openapi/base.yaml
      - path=mavio.openapi.json
      - format=json
      - content-types=json
      - short-service-tags
      - trim-unused-types
      - services=mavio.acquisition.v1.*
      - services=mavio.assistant.v1.*
      - services=mavio.auth.v1.*
      - services=mavio.hub.v1.*
      - services=mavio.library.v1.*
      - services=mavio.playback.v1.*
      - services=mavio.session.v1.*
      - services=mavio.storage.v1.*
      - services=mavio.system.v1.*
      - services=mavio.user.v1.*
