edition = "2023";

package mavio.user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// UserService manages accounts: the server's one administrator, members
// and managed users (docs/accounts.md §4.1). All methods except
// GetCurrentUser, UpdatePreferences, and managing one's own password, PIN,
// passkeys and TOTP require the administrator. Managed users have no
// passwords, passkeys or TOTP.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // SetPassword sets a user's password. Users may change their own password
  // by providing the current one.
  // Giving a managed user a password makes it a member.
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  // SetPin sets or clears a user's PIN, which guards switching to it: the
  // administrator sets managed users' PINs, other users set their own.
  rpc SetPin(SetPinRequest) returns (SetPinResponse);
  // StartPasskeyRegistration begins creating a passkey of the calling user
  // at the origin of the request (its Origin header), which must be HTTPS,
  // or HTTP on localhost, at a host name; the passkey works at that origin's
  // host. The ceremony lasts five minutes.
  rpc StartPasskeyRegistration(StartPasskeyRegistrationRequest) returns (StartPasskeyRegistrationResponse);
  // FinishPasskeyRegistration stores the passkey from the authenticator's
  // response; one that does not verify fails with INVALID_ARGUMENT.
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  // DeletePasskey removes a passkey of the calling user, or of anyone for
  // the administrator.
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
  // StartTotp begins setting up TOTP for the calling user, which signs in
  // with a password: it returns a new secret, which ConfirmTotp stores once
  // given a code of it within ten minutes.
  rpc StartTotp(StartTotpRequest) returns (StartTotpResponse);
  // ConfirmTotp ends setting up TOTP, replacing the user's previous
  // secret; a wrong code fails with INVALID_ARGUMENT.
  rpc ConfirmTotp(ConfirmTotpRequest) returns (ConfirmTotpResponse);
  // DeleteTotp turns a user's TOTP off: the calling user's, or anyone's
  // for the administrator.
  rpc DeleteTotp(DeleteTotpRequest) returns (DeleteTotpResponse);
  // UpdatePreferences changes the calling user's playback preferences.
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

// UserDataService reads and updates the calling user's per-item state.
service UserDataService {
  rpc GetUserData(GetUserDataRequest) returns (GetUserDataResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateUserData(UpdateUserDataRequest) returns (UpdateUserDataResponse);
}

enum SubtitleMode {
  // Follow the streams' default and forced flags.
  SUBTITLE_MODE_UNSPECIFIED = 0;
  SUBTITLE_MODE_ALWAYS = 1;
  SUBTITLE_MODE_FOREIGN = 2;
  SUBTITLE_MODE_FORCED = 3;
  SUBTITLE_MODE_NONE = 4;
  SUBTITLE_MODE_SMART = 5;
}

// RestrictionProfile limits what a managed user sees by content rating, on
// top of its library access; rated items within the profile alone are shown.
enum RestrictionProfile {
  // No restriction.
  RESTRICTION_PROFILE_UNSPECIFIED = 0;
  // Up to G and TV-G.
  RESTRICTION_PROFILE_YOUNGER_CHILD = 1;
  // Up to PG and TV-PG.
  RESTRICTION_PROFILE_OLDER_CHILD = 2;
  // Up to PG-13 and TV-14.
  RESTRICTION_PROFILE_TEEN = 3;
}

// User is an account. Credentials are never returned.
message User {
  string id = 1;
  string name = 2;
  // Empty for the built-in password check, otherwise the authenticating
  // plugin.
  string auth_provider = 3;
  // Whether the user is the server's administrator; exactly one user is.
  bool admin = 4;
  bool disabled = 5;
  UserPolicy policy = 6;
  UserPreferences preferences = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp last_login_time = 9;
  // A managed user has no credentials and is reached only by switching to
  // it.
  bool managed = 10;
  // Whether switching to the user asks for its PIN.
  bool has_pin = 11;
  // A managed user's restriction profile.
  RestrictionProfile restriction = 12;
  // Whether signing in with a password needs a TOTP code.
  bool has_totp = 13;
  repeated Passkey passkeys = 14;
}

// Passkey is a user's WebAuthn credential.
message Passkey {
  string id = 1;
  string name = 2;
  // The host the passkey works at.
  string rp_id = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_use_time = 5;
}

// UserPolicy is what a user may reach and do. Its library and content
// fields (all_libraries, library_ids, max_parental_rating, block_unrated,
// allowed_labels, blocked_labels, allow_download) are the user's library
// access record (docs/accounts.md §3.3).
message UserPolicy {
  // Accessible libraries; when all_libraries is true this list is ignored.
  bool all_libraries = 1;
  repeated string library_ids = 2 [(buf.validate.field).repeated.items.string.uuid = true];
  // Highest allowed parental rating score, the minimum age a rating stands
  // for (1000 and above for adult content); unset means unrestricted, 0
  // allows only content for all ages.
  int32 max_parental_rating = 3 [(buf.validate.field).int32.gte = 0];
  bool block_unrated = 4;
  bool allow_transcoding = 5;
  bool allow_download = 6;
  // Bits per second; 0 means unlimited.
  int64 max_streaming_bitrate = 7 [(buf.validate.field).int64.gte = 0];
  // 0 means unlimited.
  int32 max_sessions = 8 [(buf.validate.field).int32.gte = 0];
  // What the user may request and report; administrators may do all.
  // Unset in CreateUser takes the server's default permissions, in
  // UpdateUser keeps the current ones.
  bool request_movies = 9;
  bool request_series = 10;
  // Approve the user's requests at once.
  bool auto_approve_movies = 11;
  bool auto_approve_series = 12;
  bool report_issues = 13;
  // The user's quotas; unset uses the server's.
  RequestQuota movie_quota = 14;
  RequestQuota series_quota = 15;
  // When any, only items with one of these labels are shown. Labels are
  // tags, of the item or of an ancestor such as its series, matched
  // case-insensitively.
  repeated string allowed_labels = 16 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
  // Items with any of these labels are hidden.
  repeated string blocked_labels = 17 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
}

// RequestQuota bounds a user's requests: limit requests of movies, or
// seasons of series, in the last days.
message RequestQuota {
  // 0 for unlimited.
  int32 limit = 1 [(buf.validate.field).int32.gte = 0];
  // 0 for all time.
  int32 days = 2 [(buf.validate.field).int32.gte = 0];
}

message UserPreferences {
  // ISO 639-2/B codes in order of preference.
  repeated string audio_languages = 1 [(buf.validate.field).repeated.items.string.pattern = "^[a-z]{3}$"];
  repeated string subtitle_languages = 2 [(buf.validate.field).repeated.items.string.pattern = "^[a-z]{3}$"];
  SubtitleMode subtitle_mode = 3 [(buf.validate.field).enum.defined_only = true];
  bool play_default_audio_track = 4;
}

// UserData is the calling user's state for one item.
message UserData {
  string item_id = 1;
  bool played = 2;
  int32 play_count = 3;
  // Resume position; unset means start from the beginning.
  google.protobuf.Duration position = 4;
  // Last selected streams; subtitle_stream -1 means subtitles off.
  int32 audio_stream = 5;
  int32 subtitle_stream = 6;
  bool favorite = 7;
  // 0–10.
  double rating = 8;
  google.protobuf.Timestamp last_played_time = 9;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message GetUserRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetUserResponse {
  User user = 1;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];
  // Required unless auth_provider or managed is set.
  string password = 2 [(buf.validate.field).string.max_len = 1024];
  string auth_provider = 3;
  // Must be false: the server's one administrator is created at setup.
  bool admin = 4;
  UserPolicy policy = 5;
  UserPreferences preferences = 6;
  // Creates a managed user, without password or auth_provider.
  bool managed = 7;
  // The managed user's restriction profile.
  RestrictionProfile restriction = 8 [(buf.validate.field).enum.defined_only = true];
  // The managed user's PIN.
  string pin = 9 [(buf.validate.field).string.pattern = "^[0-9]{4}$"];
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];
  // When set, must be the user's own: the administrator stays the
  // administrator.
  bool admin = 3;
  // The administrator cannot be disabled.
  bool disabled = 4;
  UserPolicy policy = 5;
  // A managed user's restriction profile; for other users it must be
  // unspecified.
  RestrictionProfile restriction = 6 [(buf.validate.field).enum.defined_only = true];
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteUserResponse {}

message SetPasswordRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Required when users change their own password.
  string current_password = 2;
  string new_password = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
}

message SetPasswordResponse {}

message SetPinRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Four digits; empty clears the PIN.
  string pin = 2 [(buf.validate.field).string.pattern = "^([0-9]{4})?$"];
}

message SetPinResponse {}

message StartPasskeyRegistrationRequest {}

message StartPasskeyRegistrationResponse {
  string ceremony_id = 1;
  // The creation options, as
  // PublicKeyCredential.parseCreationOptionsFromJSON takes them.
  string options_json = 2;
}

message FinishPasskeyRegistrationRequest {
  string ceremony_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  // What the user calls the passkey, such as the device it is on.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  // The authenticator's response, as PublicKeyCredential.toJSON gives it.
  string credential_json = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 65536
  ];
}

message FinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
}

message DeletePasskeyRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message DeletePasskeyResponse {}

message StartTotpRequest {}

message StartTotpResponse {
  // The secret in base32, for entering by hand.
  string secret = 1;
  // The otpauth URI of the secret, for a QR code.
  string uri = 2;
}

message ConfirmTotpRequest {
  string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]{6}$"
  ];
}

message ConfirmTotpResponse {}

message DeleteTotpRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteTotpResponse {}

message UpdatePreferencesRequest {
  UserPreferences preferences = 1 [(buf.validate.field).required = true];
}

message UpdatePreferencesResponse {
  UserPreferences preferences = 1;
}

message GetUserDataRequest {
  repeated string item_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    items: {
      string: {uuid: true}
    }
  }];
}

message GetUserDataResponse {
  // Items without state are omitted.
  repeated UserData user_data = 1;
}

// UpdateUserDataRequest changes the set fields only.
message UpdateUserDataRequest {
  string item_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  bool played = 2;
  bool favorite = 3;
  google.protobuf.Duration position = 4;
  double rating = 5 [(buf.validate.field).double = {
    gte: 0
    lte: 10
  }];
}

message UpdateUserDataResponse {
  UserData user_data = 1;
}
