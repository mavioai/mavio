edition = "2023";

package mavio.plugin.v1;

import "google/protobuf/timestamp.proto";

// PasswordResetService delivers the PINs that reset users' passwords, its
// own way, such as by e-mail or chat. The server makes the PIN and checks
// it.
service PasswordResetService {
  rpc StartReset(StartResetRequest) returns (StartResetResponse);
}

message StartResetRequest {
  string user_id = 1;
  string user_name = 2;
  // The one-time PIN to deliver to the user.
  string pin = 3;
  // When the PIN stops working.
  google.protobuf.Timestamp expires = 4;
}

message StartResetResponse {}
