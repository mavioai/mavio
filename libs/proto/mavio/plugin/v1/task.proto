edition = "2023";

package mavio.plugin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// TaskRunnerService runs the tasks a plugin declares in its manifest. The
// host runs them on their interval or when an administrator asks, one run
// of a task at a time.
service TaskRunnerService {
  // RunTask runs a task to its end. An error fails the run.
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
}

// Task is a task a plugin declares.
message Task {
  // Identifier within the plugin: lowercase letters, digits and dashes.
  string id = 1;
  string name = 2;
  string description = 3;
  // Period of scheduled runs; unset runs the task only on demand.
  google.protobuf.Duration interval = 4;
  // Bound of a run, at most six hours; unset means one hour.
  google.protobuf.Duration timeout = 5;
}

message RunTaskRequest {
  string task_id = 1;
}

message RunTaskResponse {
  // Summary of what the run did, which the host logs and shows as the
  // result of its run; empty when there is nothing to tell. As it is not
  // translated, it should name what the run did, such as the models it
  // downloaded, rather than be a sentence.
  string message = 1;
}

message ReportTaskProgressRequest {
  // The task of the calling plugin running.
  string task_id = 1 [(buf.validate.field).required = true];
  // The fraction of the run done, 0 to 1.
  double progress = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  // What the run is doing, shown with the progress, such as the model it
  // downloads; at most 200 characters. As it is not translated, it should
  // name things rather than be a sentence. Empty keeps none.
  string status = 3 [(buf.validate.field).string.max_len = 200];
}

message ReportTaskProgressResponse {}

message StartTaskRequest {
  // A task of the calling plugin's manifest.
  string task_id = 1 [(buf.validate.field).required = true];
}

message StartTaskResponse {}
