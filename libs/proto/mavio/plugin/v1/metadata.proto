edition = "2023";

package mavio.plugin.v1;

import "google/protobuf/duration.proto";

// MetadataProviderService finds and fetches metadata from an external source
// such as TMDB or MusicBrainz.
service MetadataProviderService {
  // Search returns candidates for an item, best match first.
  rpc Search(SearchRequest) returns (SearchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetMetadata fetches full metadata for an item the provider knows, as
  // identified by external IDs (typically from a Search result).
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// MediaKind is the kind of item metadata is requested for.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_MOVIE = 1;
  MEDIA_KIND_SERIES = 2;
  MEDIA_KIND_SEASON = 3;
  MEDIA_KIND_EPISODE = 4;
  MEDIA_KIND_MUSIC_ARTIST = 5;
  MEDIA_KIND_MUSIC_ALBUM = 6;
  MEDIA_KIND_TRACK = 7;
  MEDIA_KIND_MUSIC_VIDEO = 8;
  MEDIA_KIND_BOOK = 9;
  MEDIA_KIND_AUDIOBOOK = 10;
  MEDIA_KIND_PERSON = 11;
  // A video that is none of the above, such as one of a home videos
  // library.
  MEDIA_KIND_VIDEO = 12;
  MEDIA_KIND_PHOTO_ALBUM = 13;
  MEDIA_KIND_PHOTO = 14;
}

// Lookup is what the host knows about an item.
message Lookup {
  MediaKind kind = 1;
  // Name parsed from the file or folder, or the current title.
  string name = 2;
  int32 year = 3;
  // Known IDs keyed by provider ("tmdb", "imdb", "tvdb", "musicbrainz", …).
  map<string, string> external_ids = 4;
  // For seasons and episodes: the series' external IDs and numbering.
  map<string, string> series_external_ids = 5;
  int32 season_number = 6;
  int32 episode_number = 7;
  // For tracks and albums.
  string album = 8;
  repeated string artists = 9;
  // ISO 639-1 language and ISO 3166-1 alpha-2 country requested by the
  // library.
  string language = 10;
  string country = 11;
  // For series, seasons and episodes: the order the series' seasons and
  // episodes are numbered in, Jellyfin's display orders: empty for the
  // aired order, or "originalAirDate", "absolute", "dvd", "digital",
  // "storyArc", "production" or "tv", the types of TMDB's episode groups.
  // Seasons and episodes are looked up by their numbers in that order.
  string display_order = 12;
  // For an episode whose file holds several: the number of the last, of
  // the same season. A provider then returns the episodes from
  // episode_number to it as one, their names and overviews joined by
  // " / ", as Jellyfin's TmdbEpisodeProvider does.
  int32 episode_number_end = 13;
  // For movies and series looked up for a title's page: the whole crew,
  // as Seerr's View Full Crew lists it, each job of it credited; else only
  // the directors, writers and producers libraries keep.
  bool all_credits = 14;
}

message SearchRequest {
  Lookup lookup = 1;
  // Maximum number of results; the provider may return fewer.
  int32 limit = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message SearchResult {
  string name = 1;
  int32 year = 2;
  string overview = 3;
  // IDs identifying the result; passed back in GetMetadataRequest.
  map<string, string> external_ids = 4;
  string image_url = 5;
  // Provider-assigned relevance in [0, 1].
  double score = 6;
}

message GetMetadataRequest {
  Lookup lookup = 1;
}

message GetMetadataResponse {
  // False when the provider has no metadata for the lookup.
  bool found = 1;
  Metadata metadata = 2;
}

enum SeriesStatus {
  SERIES_STATUS_UNSPECIFIED = 0;
  SERIES_STATUS_CONTINUING = 1;
  SERIES_STATUS_ENDED = 2;
  SERIES_STATUS_UNRELEASED = 3;
}

// Metadata is what a provider knows about an item. Unset fields are left
// unchanged by the host.
message Metadata {
  string name = 1;
  string original_title = 2;
  string sort_name = 3;
  string overview = 4;
  string tagline = 5;
  int32 production_year = 6;
  // Dates as ISO 8601 calendar dates ("2019-10-20").
  string premiere_date = 7;
  string end_date = 8;
  google.protobuf.Duration runtime = 9;
  // Content rating for the requested country, e.g. "PG-13".
  string official_rating = 10;
  // 0–10.
  double community_rating = 11;
  // 0–100.
  double critic_rating = 12;
  repeated string genres = 13;
  repeated string tags = 14;
  repeated string studios = 15;
  map<string, string> external_ids = 16;
  SeriesStatus series_status = 17;
  repeated string artists = 18;
  repeated string album_artists = 19;
  repeated PersonCredit people = 20;
  repeated RemoteImage images = 21;
  // For persons.
  string birth_date = 22;
  string death_date = 23;
  string birth_place = 24;
  // The collection (movie set) a movie belongs to; its ID is among the
  // external IDs, such as "tmdb_collection".
  string collection_name = 25;
  // For movies and series: the language (ISO 639-1) it was made in.
  string original_language = 26;
  // For movies: when the movie came out digitally and on disc, as ISO 8601
  // calendar dates; premiere_date is its release in cinemas.
  string digital_release_date = 27;
  string physical_release_date = 28;
  // For movies: other titles of the movie, and its titles in other
  // languages, by which releases may name it.
  repeated string alternative_titles = 29;
  repeated string translated_titles = 30;
  // For movies: another year releases may give the movie, such as that of
  // its premiere when it differs from production_year.
  int32 secondary_year = 31;
  // For movies: the countries the movie was produced in, by name.
  repeated string production_locations = 36;
  // URLs of trailers hosted elsewhere, such as on YouTube.
  repeated string remote_trailers = 37;

  // What a title's page tells of it beyond the item, which the host does
  // not store, as Seerr shows of a movie or series.
  // For movies: its budget and box office takings, in US dollars.
  int64 budget = 32;
  int64 revenue = 33;
  // For series: the air date of its next episode, as an ISO 8601 calendar
  // date.
  string next_air_date = 34;
  // The services streaming it by subscription in the requested country,
  // in the provider's order.
  repeated WatchProvider watch_providers = 35;
  // For movies and series: where it is in its making and run.
  ProductionStatus production_status = 38;
  // For movies: its release in cinemas in the requested country, else the
  // earliest anywhere, as an ISO 8601 calendar date.
  string theatrical_release_date = 39;
  // For movies and series: the countries it was produced in, as ISO 3166-1
  // alpha-2 codes.
  repeated string production_countries = 40;
  // The genres, keywords (tags) and studios (a series' networks) by the
  // provider's IDs of discovery filters, by which a title's page lists
  // titles alike.
  repeated Reference genre_refs = 41;
  repeated Reference keyword_refs = 42;
  repeated Reference studio_refs = 43;
  // The number of votes community_rating counts.
  int32 vote_count = 44;
}

// ProductionStatus is where a title is in its making and run, as TMDB
// tells it.
enum ProductionStatus {
  PRODUCTION_STATUS_UNSPECIFIED = 0;
  PRODUCTION_STATUS_RUMORED = 1;
  PRODUCTION_STATUS_PLANNED = 2;
  PRODUCTION_STATUS_IN_PRODUCTION = 3;
  PRODUCTION_STATUS_POST_PRODUCTION = 4;
  PRODUCTION_STATUS_RELEASED = 5;
  PRODUCTION_STATUS_CANCELED = 6;
  // For series.
  PRODUCTION_STATUS_PILOT = 7;
  PRODUCTION_STATUS_RETURNING = 8;
  PRODUCTION_STATUS_ENDED = 9;
}

// Reference is a value a provider identifies, such as a genre.
message Reference {
  // The provider's ID, such as those of discovery filters.
  string id = 1;
  string name = 2;
}

// WatchProvider is a service streaming a title.
message WatchProvider {
  string name = 1;
  string logo_url = 2;
}

enum CreditKind {
  CREDIT_KIND_UNSPECIFIED = 0;
  CREDIT_KIND_ACTOR = 1;
  CREDIT_KIND_GUEST_STAR = 2;
  CREDIT_KIND_DIRECTOR = 3;
  CREDIT_KIND_WRITER = 4;
  CREDIT_KIND_PRODUCER = 5;
  CREDIT_KIND_CREATOR = 6;
  CREDIT_KIND_COMPOSER = 7;
  CREDIT_KIND_CONDUCTOR = 8;
  CREDIT_KIND_LYRICIST = 9;
  CREDIT_KIND_ARTIST = 10;
  CREDIT_KIND_AUTHOR = 11;
  CREDIT_KIND_NARRATOR = 12;
  CREDIT_KIND_OTHER = 13;
}

message PersonCredit {
  string name = 1;
  CreditKind kind = 2;
  // Character played, or a more specific job title.
  string role = 3;
  int32 order = 4;
  map<string, string> external_ids = 5;
  string image_url = 6;
}

enum ImageKind {
  IMAGE_KIND_UNSPECIFIED = 0;
  IMAGE_KIND_PRIMARY = 1;
  IMAGE_KIND_BACKDROP = 2;
  IMAGE_KIND_LOGO = 3;
  IMAGE_KIND_THUMB = 4;
  IMAGE_KIND_BANNER = 5;
  IMAGE_KIND_ART = 6;
  IMAGE_KIND_DISC = 7;
  IMAGE_KIND_SCREENSHOT = 8;
}

message RemoteImage {
  ImageKind kind = 1;
  string url = 2;
  int32 width = 3;
  int32 height = 4;
  // ISO 639-1; empty for images without text.
  string language = 5;
  // Provider-assigned quality in [0, 1].
  double score = 6;
}
