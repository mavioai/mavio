edition = "2023";

package mavio.auth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mavio/user/v1/user.proto";

// AuthService signs clients in and out. GetAuthInfo, CreateFirstUser,
// Login, StartPasskeySignIn, FinishPasskeySignIn, StartRefresh,
// RefreshSession, the Quick Connect methods except AuthorizeQuickConnect,
// ForgotPassword, ResetPassword, GetInvitation, StartInvitationPasskey,
// AcceptInvitation, StartSignIn and SignInWithAssertion are public; the other methods act on the calling user.
//
// In mavio.dev mode devices sign in with SignInWithAssertion: Login, the
// passkey sign-in, Quick Connect, password resets, invitations and
// switching fail with FAILED_PRECONDITION, as mavio.dev keeps them.
//
// A session belongs to a device's Ed25519 key. Its access token lasts an
// hour; before it expires, or when a call fails with UNAUTHENTICATED
// because it has, the device asks StartRefresh for a nonce and signs it
// with its key for a new token from RefreshSession.
service AuthService {
  // GetAuthInfo tells clients how to sign in.
  rpc GetAuthInfo(GetAuthInfoRequest) returns (GetAuthInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateFirstUser sets up a server in standalone mode: it chooses the
  // mode, creates the administrator and signs it in. It fails with
  // FAILED_PRECONDITION once the server's mode is chosen.
  rpc CreateFirstUser(CreateFirstUserRequest) returns (CreateFirstUserResponse);
  // Login signs a device in with a password, replacing its previous
  // session. Wrong credentials and disabled users fail with
  // UNAUTHENTICATED; a user with TOTP needs its code, and fails with
  // FAILED_PRECONDITION when the right password comes without one. After
  // three failures for a name or from an address, each failure locks them
  // out twice as long as the one before, from a second up to 15 minutes,
  // and sign-ins fail with RESOURCE_EXHAUSTED meanwhile.
  rpc Login(LoginRequest) returns (LoginResponse);
  // StartPasskeySignIn begins signing in with a passkey at the origin of
  // the request (its Origin header), which must be HTTPS, or HTTP on
  // localhost, at a host name; the ceremony lasts five minutes.
  rpc StartPasskeySignIn(StartPasskeySignInRequest) returns (StartPasskeySignInResponse);
  // FinishPasskeySignIn signs a device in with the passkey's response,
  // which names its user. A passkey needs no TOTP code; one that does not
  // verify fails with UNAUTHENTICATED.
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (FinishPasskeySignInResponse);
  // StartRefresh gives a session's device a nonce to sign for
  // RefreshSession, valid for two minutes. Unknown sessions are
  // UNAUTHENTICATED.
  rpc StartRefresh(StartRefreshRequest) returns (StartRefreshResponse);
  // RefreshSession issues a new access token for the device's signature of
  // the nonce: Ed25519 over "mavio-session-refresh-v1", a zero byte, the
  // session ID's 16 bytes and the nonce. A wrong signature, a used or
  // expired nonce, a disabled user and a session idle for longer than the
  // server's session_idle_days are UNAUTHENTICATED; the device then signs
  // in again.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  // Logout ends the calling session.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // ListSessions lists the calling user's signed-in devices, most recently
  // seen first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeSession signs one of the calling user's devices out.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // StartQuickConnect begins signing a device in from a signed-in one
  // (Quick Connect): the new device shows the code, a signed-in user
  // enters it with AuthorizeQuickConnect, and the new device, polling
  // GetQuickConnectState, then signs in with LoginWithQuickConnect as that
  // user. The request expires after ten minutes, or one minute after it
  // was authorized.
  rpc StartQuickConnect(StartQuickConnectRequest) returns (StartQuickConnectResponse);
  // GetQuickConnectState tells whether a request was authorized; unknown
  // and expired requests are NOT_FOUND.
  rpc GetQuickConnectState(GetQuickConnectStateRequest) returns (GetQuickConnectStateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AuthorizeQuickConnect signs the device waiting with the code in as the
  // calling user.
  rpc AuthorizeQuickConnect(AuthorizeQuickConnectRequest) returns (AuthorizeQuickConnectResponse);
  // LoginWithQuickConnect gives the authorized device its access token,
  // once.
  rpc LoginWithQuickConnect(LoginWithQuickConnectRequest) returns (LoginWithQuickConnectResponse);
  // CreateApiKey makes a token an integration calls the API with, as the
  // administrator creating it; the token is returned once. Administrators
  // only.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // ListApiKeys lists every API key. Administrators only.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeApiKey deletes an API key. Administrators only.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  // ForgotPassword has the password reset plugin chosen in the server
  // settings deliver a PIN to the user, which resets the password within
  // 30 minutes. It answers the same whether or not the user exists.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  // ResetPassword sets a new password with the PIN ForgotPassword
  // delivered, and ends the user's sessions.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // GetInvitation describes an invitation link before it is accepted.
  // Unknown, used up and expired invitations are NOT_FOUND.
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // StartInvitationPasskey begins creating the passkey of the member an
  // invitation creates, at the origin of the request as
  // UserService.StartPasskeyRegistration does; AcceptInvitation finishes
  // it.
  rpc StartInvitationPasskey(StartInvitationPasskeyRequest) returns (StartInvitationPasskeyResponse);
  // AcceptInvitation creates a member with a password or a passkey, or
  // converts the invitation's managed user into one, and signs the device
  // in as it. An invitation used up or expired meanwhile is NOT_FOUND; a
  // taken name is ALREADY_EXISTS; a passkey that does not verify is
  // INVALID_ARGUMENT.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  // ListSwitchableUsers lists the enabled users the calling session may
  // switch to: on a session signed in as the administrator, or switched
  // from one, every user (docs/accounts.md §4.4). Other sessions are
  // PERMISSION_DENIED.
  rpc ListSwitchableUsers(ListSwitchableUsersRequest) returns (ListSwitchableUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SwitchUser makes the calling session the given user's: its access
  // token and refreshes then act as that user, and the session can still
  // switch. A user with a PIN needs it: without one the call is
  // FAILED_PRECONDITION, a wrong one PERMISSION_DENIED, and after three
  // wrong PINs for a user each locks it out twice as long as the one
  // before, as Login does, with RESOURCE_EXHAUSTED meanwhile. Streams the
  // session opened before switching keep their user, so the client opens
  // them again.
  rpc SwitchUser(SwitchUserRequest) returns (SwitchUserResponse);
  // StartSignIn starts signing a Mavio account in to the server's web UI
  // (docs/accounts.md §6): the server pushes the web UI's authorization
  // request to mavio.dev, signed with its identity key, and returns the
  // page where the account approves it, which sends the browser to the
  // redirect URI with an authorization code for the device key. While the
  // server's mode is unset, or it is unclaimed in mavio.dev mode, signing
  // in claims it (docs/accounts.md §3.2): the account that approves
  // becomes the administrator, and the server learns of it when the
  // account signs in with SignInWithAssertion. It fails with
  // FAILED_PRECONDITION when the server is standalone and UNAVAILABLE when
  // mavio.dev cannot be reached.
  rpc StartSignIn(StartSignInRequest) returns (StartSignInResponse);
  // SignInWithAssertion signs a device in to a server in mavio.dev mode
  // with a sign-in assertion mavio.dev issued for the server and the
  // device's key, replacing the device's previous session. The device
  // signs, with its key, "mavio-sign-in-assertion-v1", a zero byte and the
  // assertion. A wrong, expired or used assertion, a wrong signature and
  // an account without access to the server fail with UNAUTHENTICATED; a
  // server not in mavio.dev mode fails with FAILED_PRECONDITION. On a
  // server that a sign-in is claiming, it first asks mavio.dev for the
  // account that approved it, and fails with UNAVAILABLE when mavio.dev
  // cannot be reached.
  rpc SignInWithAssertion(SignInWithAssertionRequest) returns (SignInWithAssertionResponse);
}

// Device identifies a client installation.
message Device {
  // Stable for the installation; signing in again from the same device
  // replaces its session.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
  // Shown to the user, e.g. "Living room TV".
  string name = 2 [(buf.validate.field).string.max_len = 128];
  // The application, e.g. "Mavio Web".
  string client = 3 [(buf.validate.field).string.max_len = 64];
  string client_version = 4 [(buf.validate.field).string.max_len = 64];
  // The installation's Ed25519 public key, which signs the session's
  // refreshes. Required to sign in.
  bytes public_key = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
}

// Session is a signed-in device.
message Session {
  string id = 1;
  Device device = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp last_seen_time = 4;
  // Whether this is the session making the request.
  bool current = 5;
}

// AccountMode is how a server signs people in, chosen when it is set up.
enum AccountMode {
  // The server's setup has not chosen a mode yet.
  ACCOUNT_MODE_UNSPECIFIED = 0;
  // The server keeps its own users.
  ACCOUNT_MODE_STANDALONE = 1;
  // Every user is a Mavio account, kept by mavio.dev.
  ACCOUNT_MODE_MAVIO_DEV = 2;
}

message GetAuthInfoRequest {}

message GetAuthInfoResponse {
  // True until the server's setup has chosen its mode, and while a server
  // in mavio.dev mode is unclaimed.
  bool setup_required = 1;
  // Tells the server apart from others whatever address reaches it: the
  // fingerprint of its identity key.
  string server_id = 2;
  // The name the server shows, its host name unless administrators set one.
  string server_name = 3;
  string version = 4;
  // How the server signs people in; unspecified until its setup chooses.
  AccountMode mode = 5;
  // In mavio.dev mode, and while setup has not chosen a mode, the base URL
  // of mavio.dev's API, where the server is claimed and clients sign in.
  string mavio_dev_url = 6;
}

message CreateFirstUserRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];
  string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
  Device device = 3 [(buf.validate.field).required = true];
}

message CreateFirstUserResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  // When the access token expires.
  google.protobuf.Timestamp access_token_expire_time = 4;
}

message LoginRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  string password = 2 [(buf.validate.field).string.max_len = 1024];
  Device device = 3 [(buf.validate.field).required = true];
  // The current code of the user's TOTP, when it has one.
  string totp_code = 4 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
}

message LoginResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  // When the access token expires.
  google.protobuf.Timestamp access_token_expire_time = 4;
}

message StartPasskeySignInRequest {}

message StartPasskeySignInResponse {
  string ceremony_id = 1;
  // The request options, as PublicKeyCredential.parseRequestOptionsFromJSON
  // takes them.
  string options_json = 2;
}

message FinishPasskeySignInRequest {
  string ceremony_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  // The passkey's response, as PublicKeyCredential.toJSON gives it.
  string credential_json = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 65536
  ];
  Device device = 3 [(buf.validate.field).required = true];
}

message FinishPasskeySignInResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  // When the access token expires.
  google.protobuf.Timestamp access_token_expire_time = 4;
}

message StartRefreshRequest {
  string session_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message StartRefreshResponse {
  bytes nonce = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message RefreshSessionRequest {
  string session_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  bytes nonce = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
  bytes signature = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 64
  ];
}

message RefreshSessionResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  google.protobuf.Timestamp access_token_expire_time = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message RevokeSessionResponse {}

message StartQuickConnectRequest {
  Device device = 1 [(buf.validate.field).required = true];
}

message StartQuickConnectResponse {
  // Kept by the new device to poll and sign in; never shown.
  string secret = 1;
  // Six digits the user enters on a signed-in device.
  string code = 2;
  google.protobuf.Timestamp expire_time = 3;
}

message GetQuickConnectStateRequest {
  string secret = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

message GetQuickConnectStateResponse {
  bool authorized = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message AuthorizeQuickConnectRequest {
  string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]{6}$"
  ];
}

message AuthorizeQuickConnectResponse {
  // The device signed in.
  Device device = 1;
}

message LoginWithQuickConnectRequest {
  string secret = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];
}

// LoginWithQuickConnectResponse is a LoginResponse.
message LoginWithQuickConnectResponse {
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  google.protobuf.Timestamp access_token_expire_time = 4;
}

// ApiKey is an integration's key, without its token.
message ApiKey {
  string id = 1;
  string name = 2;
  // The administrator it acts as.
  string user_id = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_use_time = 5;
}

message CreateApiKeyRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // Sent as "Authorization: Bearer <token>"; not shown again.
  string token = 2;
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

message RevokeApiKeyRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message RevokeApiKeyResponse {}

message ForgotPasswordRequest {
  string name = 1 [(buf.validate.field).required = true];
}

message ForgotPasswordResponse {
  // When the PIN, if one was delivered, stops working.
  google.protobuf.Timestamp expire_time = 1;
}

message ResetPasswordRequest {
  string name = 1 [(buf.validate.field).required = true];
  string pin = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  string new_password = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
}

message ResetPasswordResponse {}

message GetInvitationRequest {
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
}

message GetInvitationResponse {
  // The name of the managed user the invitation converts; unset when it
  // creates a member.
  string user_name = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message StartInvitationPasskeyRequest {
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  // The name of the member to create, shown by the authenticator; a
  // converted user's own name when unset.
  string name = 2 [(buf.validate.field).string.max_len = 100];
}

message StartInvitationPasskeyResponse {
  string ceremony_id = 1;
  // The creation options, as
  // PublicKeyCredential.parseCreationOptionsFromJSON takes them.
  string options_json = 2;
}

message AcceptInvitationRequest {
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100
  ];
  // The member's name: required when the invitation creates a member; a
  // converted user keeps its name when unset.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // The member's password; either it or a passkey is required.
  string password = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // The passkey ceremony StartInvitationPasskey began, with the
  // authenticator's response as PublicKeyCredential.toJSON gives it.
  string ceremony_id = 4 [(buf.validate.field).string.max_len = 100];
  string credential_json = 5 [(buf.validate.field).string.max_len = 65536];
  // What the member calls the passkey.
  string passkey_name = 6 [(buf.validate.field).string.max_len = 100];
  Device device = 7 [(buf.validate.field).required = true];
}

message AcceptInvitationResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  // When the access token expires.
  google.protobuf.Timestamp access_token_expire_time = 4;
}

message ListSwitchableUsersRequest {}

message ListSwitchableUsersResponse {
  repeated SwitchableUser users = 1;
}

// SwitchableUser is a user a session can switch to.
message SwitchableUser {
  string id = 1;
  string name = 2;
  bool admin = 3;
  bool managed = 4;
  // Switching to the user needs its PIN.
  bool has_pin = 5;
  // The session's current user.
  bool current = 6;
}

message SwitchUserRequest {
  string user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  string pin = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}$"];
}

message SwitchUserResponse {
  // The user the session now acts as.
  mavio.user.v1.User user = 1;
}

message StartSignInRequest {
  // Where mavio.dev sends the browser back with the authorization code:
  // the web UI's own page, at whatever address it was opened.
  string redirect_uri = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
  // The S256 PKCE challenge: the base64url SHA-256 of the verifier.
  string code_challenge = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 43
  ];
  // The Ed25519 public key of the device that signs in.
  bytes device_key = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
  // Sent back with the code.
  string state = 4 [(buf.validate.field).string.max_len = 128];
}

message StartSignInResponse {
  // The page at mavio.dev where the account approves signing in.
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message SignInWithAssertionRequest {
  // The JWT mavio.dev signed.
  string assertion = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // The device the assertion names by its public key.
  Device device = 2 [(buf.validate.field).required = true];
  // The device's Ed25519 signature of "mavio-sign-in-assertion-v1", a
  // zero byte and the assertion.
  bytes signature = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 64
  ];
}

message SignInWithAssertionResponse {
  // Sent as "Authorization: Bearer <access_token>".
  string access_token = 1;
  mavio.user.v1.User user = 2;
  Session session = 3;
  // When the access token expires.
  google.protobuf.Timestamp access_token_expire_time = 4;
}
