edition = "2023";

package mavio.system.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mavio/plugin/v1/container.proto";
import "mavio/plugin/v1/plugin.proto";

// PluginManagementService installs, configures, starts and stops the
// plugins the server runs. Administrators only.
service PluginManagementService {
  // ListPlugins lists the plugins found in the server's plugin folder, by
  // ID.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetPluginConfig returns a plugin's configuration.
  rpc GetPluginConfig(GetPluginConfigRequest) returns (GetPluginConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetPluginConfig validates a configuration against the plugin's schema,
  // delivers it to the running plugin and stores it once the plugin
  // accepts it. Properties the schema marks generated, strings of format
  // uuid that are readOnly, are given new UUIDs where they are missing or
  // empty.
  rpc SetPluginConfig(SetPluginConfigRequest) returns (SetPluginConfigResponse);
  // ListPluginConfigOptions lists the values a property of a plugin's
  // configuration takes, from the source its schema names with
  // x-mavio-options, such as the definitions of an indexer provider.
  rpc ListPluginConfigOptions(ListPluginConfigOptionsRequest) returns (ListPluginConfigOptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListCatalogPlugins lists the plugins of the configured plugin
  // catalogs, with the versions the server can run.
  rpc ListCatalogPlugins(ListCatalogPluginsRequest) returns (ListCatalogPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // InstallPlugin installs a plugin from a catalog, or upgrades or
  // downgrades it to a version, while the server runs on; the plugin keeps
  // its configuration.
  rpc InstallPlugin(InstallPluginRequest) returns (InstallPluginResponse);
  // UninstallPlugin stops a plugin and removes its folder and
  // configuration.
  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse);
  // SetPluginEnabled stops a plugin, keeping it installed with its
  // configuration, or starts it again; the server remembers it across
  // restarts and upgrades.
  rpc SetPluginEnabled(SetPluginEnabledRequest) returns (SetPluginEnabledResponse);
  // GetContainerRuntime tells whether a container engine is available to
  // run plugins' container dependencies, detecting it again when asked.
  rpc GetContainerRuntime(GetContainerRuntimeRequest) returns (GetContainerRuntimeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListPluginContainers lists a plugin's container dependencies with how
  // they are reached and whether they can be used.
  rpc ListPluginContainers(ListPluginContainersRequest) returns (ListPluginContainersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetPluginContainer sets how a container dependency is reached: run by
  // the server, which requires a container engine, or at an address.
  rpc SetPluginContainer(SetPluginContainerRequest) returns (SetPluginContainerResponse);
}

// PluginState is whether a plugin is in use.
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  // The plugin runs with its configuration, or needs none.
  PLUGIN_STATE_READY = 1;
  // The plugin runs but waits for a configuration its schema requires.
  PLUGIN_STATE_UNCONFIGURED = 2;
  // The plugin could not be started or rejected its stored configuration;
  // see Plugin.error.
  PLUGIN_STATE_FAILED = 3;
  // An administrator disabled the plugin: it is installed but not started.
  PLUGIN_STATE_DISABLED = 4;
}

// Plugin is a plugin found in the server's plugin folder.
message Plugin {
  // The plugin's manifest. For a folder whose manifest cannot be read,
  // only the ID is set, from the folder's name.
  mavio.plugin.v1.Manifest manifest = 1;
  PluginState state = 2;
  // Why the plugin failed, for PLUGIN_STATE_FAILED.
  string error = 3;
}

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

message GetPluginConfigRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
}

message GetPluginConfigResponse {
  // JSON matching the manifest's config_schema; empty when the plugin was
  // never configured.
  string config_json = 1;
  // When the configuration was last set; unset when never configured.
  google.protobuf.Timestamp update_time = 2;
}

message SetPluginConfigRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
  // JSON matching the manifest's config_schema.
  string config_json = 2 [(buf.validate.field).required = true];
}

message SetPluginConfigResponse {
  Plugin plugin = 1;
  // The configuration stored, with the generated properties set.
  string config_json = 2;
}

message ListPluginConfigOptionsRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
  // The source x-mavio-options names: "indexer-definitions" and
  // "download-client-definitions", the definitions of the plugin's
  // providers, or "download-clients", the clients of every download client
  // provider.
  string source = 2 [(buf.validate.field).required = true];
}

message ListPluginConfigOptionsResponse {
  repeated PluginConfigOption options = 1;
}

// PluginConfigOption is a value a property of a configuration takes.
message PluginConfigOption {
  string value = 1;
  string name = 2;
  string description = 3;
  // What sets the option apart, as keys clients show in their words:
  // "torrent" or "usenet", "public", "semi-private" or "private", and a
  // BCP 47 language tag such as "en-US".
  repeated string tags = 4;
  // The JSON Schema of the settings the option takes, which the property
  // x-mavio-options names as its settings holds; empty for none.
  string settings_schema = 5;
}

// CatalogPlugin is a plugin a catalog offers.
message CatalogPlugin {
  string id = 1;
  string name = 2;
  string description = 3;
  string author = 4;
  string homepage = 5;
  // The catalog listing it.
  string catalog_url = 6;
  // Newest first; only versions the server can run, none when it can run
  // no version.
  repeated CatalogVersion versions = 7;
  // Empty when not installed.
  string installed_version = 8;
  mavio.plugin.v1.Category category = 9;
}

// CatalogVersion is a version of a catalog plugin.
message CatalogVersion {
  string version = 1;
  string changelog = 2;
  google.protobuf.Timestamp release_time = 3;
}

message ListCatalogPluginsRequest {}

message ListCatalogPluginsResponse {
  repeated CatalogPlugin plugins = 1;
}

message InstallPluginRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
  // Unset means the newest version.
  string version = 2;
}

message InstallPluginResponse {
  Plugin plugin = 1;
}

message UninstallPluginRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
}

message UninstallPluginResponse {}

message SetPluginEnabledRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
  bool enabled = 2;
}

message SetPluginEnabledResponse {
  Plugin plugin = 1;
}

// ContainerRuntime is the container engine the server found.
message ContainerRuntime {
  // Whether an engine answered; reason tells why not.
  bool available = 1;
  string reason = 2;
  // The engine's endpoint, e.g. "unix:///var/run/docker.sock".
  string endpoint = 3;
  // "docker" or "podman", its release and the API version used.
  string engine = 4;
  string version = 5;
  string api_version = 6;
  bool rootless = 7;
  // Whether the server runs in a container.
  bool in_container = 8;
  // Whether the server reaches what it runs through ports on the
  // loopback interface rather than a network its container joins.
  bool on_host = 9;
}

message GetContainerRuntimeRequest {
  // Detect the engine again rather than tell what was found last.
  bool detect = 1;
}

message GetContainerRuntimeResponse {
  ContainerRuntime runtime = 1;
}

// PluginContainer is a container dependency of a plugin.
message PluginContainer {
  // As the plugin's manifest declares it.
  mavio.plugin.v1.ContainerDependency dependency = 1;
  mavio.plugin.v1.ContainerStatus status = 2;
  // Whether a managed container may use a GPU.
  bool use_gpu = 3;
  // How to run it without a GPU, for an external dependency; unset when
  // it needs one. They hold its generated secrets.
  ContainerCommands commands = 4;
  // How to run it with a GPU, for a dependency that can use one.
  ContainerCommands gpu_commands = 5;
}

// ContainerCommands run a container dependency outside the server, under
// the name and volumes a managed one would have.
message ContainerCommands {
  // A docker run command; for a server in a container it joins a network
  // written "<network>", for the administrator to name.
  string docker_run = 1;
  // A Compose file of the service, to merge beside the server's own.
  string compose = 2;
  // The address to set once it runs.
  string address = 3;
}

message ListPluginContainersRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
}

message ListPluginContainersResponse {
  // In manifest order.
  repeated PluginContainer containers = 1;
}

message SetPluginContainerRequest {
  string plugin_id = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).required = true];
  mavio.plugin.v1.ContainerMode mode = 3;
  // Base URL of an external dependency, http or https; required for
  // CONTAINER_MODE_EXTERNAL and empty otherwise.
  string address = 4 [(buf.validate.field).string.uri = true];
  // Whether a managed container may use a GPU.
  bool use_gpu = 5;
}

message SetPluginContainerResponse {
  PluginContainer container = 1;
}
