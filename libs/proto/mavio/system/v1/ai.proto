edition = "2023";

package mavio.system.v1;

import "buf/validate/validate.proto";
import "mavio/plugin/v1/ai.proto";

// AiProviderService administers the AI model providers the server's
// features use, through the plugin with the AI_GATEWAY capability, which
// keeps their credentials: API keys, and OAuth logins relayed to the
// administrator. Every RPC requires an administrator; without a started
// AI gateway plugin they fail with FAILED_PRECONDITION.
service AiProviderService {
  // ListAiProviders lists the providers with how they authenticate and
  // whether they can be used.
  rpc ListAiProviders(ListAiProvidersRequest) returns (ListAiProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListAiModels lists the providers' models.
  rpc ListAiModels(ListAiModelsRequest) returns (ListAiModelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetAiApiKey stores a provider's API key, or removes it.
  rpc SetAiApiKey(SetAiApiKeyRequest) returns (SetAiApiKeyResponse);
  // StartAiLogin starts a provider's OAuth login. Logins to subscriptions
  // (AiProvider.subscription) may break the provider's terms; clients
  // warn of it and leave the choice to the administrator.
  rpc StartAiLogin(StartAiLoginRequest) returns (StartAiLoginResponse);
  // GetAiLogin returns a login's state: what to show, what it asks and
  // whether it ended.
  rpc GetAiLogin(GetAiLoginRequest) returns (GetAiLoginResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchAiLogin streams a login's state: as it is, then each time it
  // changes, until the login ends. Clients follow a login with it.
  rpc WatchAiLogin(WatchAiLoginRequest) returns (stream WatchAiLoginResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AnswerAiLogin answers a login's prompt.
  rpc AnswerAiLogin(AnswerAiLoginRequest) returns (AnswerAiLoginResponse);
  // CancelAiLogin abandons a login.
  rpc CancelAiLogin(CancelAiLoginRequest) returns (CancelAiLoginResponse);
  // LogoutAi removes a provider's stored credential.
  rpc LogoutAi(LogoutAiRequest) returns (LogoutAiResponse);
}

// AiConversationService keeps the administrators' conversations with the
// models, through the plugin with the AGENT_SESSION capability. Every RPC
// requires an administrator; without a started plugin with the
// AGENT_SESSION capability they fail with FAILED_PRECONDITION.
service AiConversationService {
  // CreateAiConversation starts a conversation with a model.
  rpc CreateAiConversation(CreateAiConversationRequest) returns (CreateAiConversationResponse);
  // ListAiConversations lists the conversations, newest first.
  rpc ListAiConversations(ListAiConversationsRequest) returns (ListAiConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetAiConversation returns a conversation with its messages.
  rpc GetAiConversation(GetAiConversationRequest) returns (GetAiConversationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SendAiMessage sends a message to a conversation and streams the answer
  // as the model writes it, ending with the answer.
  rpc SendAiMessage(SendAiMessageRequest) returns (stream SendAiMessageResponse);
  // DeleteAiConversation deletes a conversation.
  rpc DeleteAiConversation(DeleteAiConversationRequest) returns (DeleteAiConversationResponse);
}

message ListAiProvidersRequest {}

message ListAiProvidersResponse {
  // The AI gateway plugin.
  string plugin_id = 1;
  repeated mavio.plugin.v1.AiProvider providers = 2;
}

message ListAiModelsRequest {
  // The provider whose models are listed; every provider's when empty.
  string provider = 1;
  // Only models of providers that can be used.
  bool available = 2;
}

message ListAiModelsResponse {
  repeated mavio.plugin.v1.AiModel models = 1;
}

message SetAiApiKeyRequest {
  string provider = 1 [(buf.validate.field).required = true];
  // The key; empty removes the stored one.
  string key = 2;
}

message SetAiApiKeyResponse {}

message StartAiLoginRequest {
  string provider = 1 [(buf.validate.field).required = true];
}

message StartAiLoginResponse {
  string login_id = 1;
}

message GetAiLoginRequest {
  string login_id = 1 [(buf.validate.field).required = true];
}

message GetAiLoginResponse {
  mavio.plugin.v1.AiLoginState state = 1;
  // What the login showed so far, oldest first.
  repeated mavio.plugin.v1.AiLoginEvent events = 2;
  // What the login asks now, if anything.
  mavio.plugin.v1.AiLoginPrompt prompt = 3;
  // Why it failed.
  string error = 4;
}

message WatchAiLoginRequest {
  string login_id = 1 [(buf.validate.field).required = true];
}

message WatchAiLoginResponse {
  mavio.plugin.v1.AiLoginState state = 1;
  // What the login showed so far, oldest first.
  repeated mavio.plugin.v1.AiLoginEvent events = 2;
  // What the login asks now, if anything.
  mavio.plugin.v1.AiLoginPrompt prompt = 3;
  // Why it failed.
  string error = 4;
}

message AnswerAiLoginRequest {
  string login_id = 1 [(buf.validate.field).required = true];
  string prompt_id = 2 [(buf.validate.field).required = true];
  string value = 3;
}

message AnswerAiLoginResponse {}

message CancelAiLoginRequest {
  string login_id = 1 [(buf.validate.field).required = true];
}

message CancelAiLoginResponse {}

message LogoutAiRequest {
  string provider = 1 [(buf.validate.field).required = true];
}

message LogoutAiResponse {}

message CreateAiConversationRequest {
  string provider = 1 [(buf.validate.field).required = true];
  string model = 2 [(buf.validate.field).required = true];
  // The instructions the model follows.
  string instructions = 3 [(buf.validate.field).string.max_len = 20000];
  string title = 4 [(buf.validate.field).string.max_len = 200];
}

message CreateAiConversationResponse {
  mavio.plugin.v1.AgentSession conversation = 1;
}

message ListAiConversationsRequest {}

message ListAiConversationsResponse {
  repeated mavio.plugin.v1.AgentSession conversations = 1;
}

message GetAiConversationRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message GetAiConversationResponse {
  mavio.plugin.v1.AgentSession conversation = 1;
  repeated mavio.plugin.v1.AgentMessage messages = 2;
}

message SendAiMessageRequest {
  string conversation_id = 1 [(buf.validate.field).required = true];
  string text = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 100000
  ];
  // Makes a retried message the same message instead of a second one.
  string request_id = 3 [(buf.validate.field).string.max_len = 100];
}

message SendAiMessageResponse {
  oneof event {
    // The answer so far; a retried attempt starts it again.
    string text = 1;
    // The answer, last.
    mavio.plugin.v1.SendAgentMessageResponse done = 2;
  }
}

message DeleteAiConversationRequest {
  string id = 1 [(buf.validate.field).required = true];
}

message DeleteAiConversationResponse {}
