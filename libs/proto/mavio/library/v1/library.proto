edition = "2023";

package mavio.library.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// LibraryService manages libraries and their scans.
service LibraryService {
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateLibrary(CreateLibraryRequest) returns (CreateLibraryResponse);
  rpc UpdateLibrary(UpdateLibraryRequest) returns (UpdateLibraryResponse);
  // DeleteLibrary removes the library and all its items. Media files are not
  // touched.
  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse);
  // ScanLibrary enqueues a reconciliation scan. A scan that is already
  // pending is not enqueued again; one asked for while a scan runs is
  // enqueued, and runs after it.
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse);
}

// LibraryKind decides how a library's folders are interpreted.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  LIBRARY_KIND_MOVIES = 1;
  LIBRARY_KIND_SHOWS = 2;
  LIBRARY_KIND_MUSIC = 3;
  LIBRARY_KIND_MUSIC_VIDEOS = 4;
  LIBRARY_KIND_HOME_VIDEOS = 5;
  LIBRARY_KIND_BOOKS = 6;
  LIBRARY_KIND_PHOTOS = 7;
  LIBRARY_KIND_MIXED = 8;
  // The collections and the playlists users curate, in two libraries the
  // server creates when first needed. They have no folders, cannot be
  // created, changed or scanned through LibraryService, and the playlists
  // library is open to every user, each seeing their own playlists.
  LIBRARY_KIND_COLLECTIONS = 9;
  LIBRARY_KIND_PLAYLISTS = 10;
}

// Library is a named set of root folders scanned as one collection.
message Library {
  string id = 1;
  string name = 2;
  LibraryKind kind = 3;
  // Root folders: absolute paths of the server's file system, or
  // "rclone:<remote>:<path>" for a folder below an rclone remote's root. A
  // path belongs to at most one library.
  repeated string paths = 4;
  // Period of scheduled reconciliation scans; unset disables them.
  google.protobuf.Duration scan_interval = 5;
  // ISO 639-1 language and ISO 3166-1 alpha-2 country for metadata.
  string preferred_language = 6;
  string metadata_country = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  // Write NFO files and chosen artwork next to the media, where scans read
  // them back.
  bool save_local_metadata = 10;
  // Put movies into collections named after the metadata providers'
  // collections (movie sets).
  bool auto_collections = 11;
  // Make thumbnail sheets of videos for seeking, and an image of each
  // chapter.
  bool extract_trickplay = 12;
  bool extract_chapter_images = 13;
  // Measure the loudness of tracks, for normalization.
  bool analyze_loudness = 14;
  // Download lyrics for tracks without any when refreshing them.
  bool download_lyrics = 15;
  // The providers the library uses.
  ProviderOrder provider_order = 16;
  // The episodes a series lacks that refreshes add to it as virtual items.
  VirtualEpisodes virtual_episodes = 17;
  // The hubs of the library on Home and on its Recommended tab.
  LibraryHubs hubs = 18;
  // The storage classes the administrator set, by path; the other paths
  // are classified by the device holding them.
  map<string, StorageClass> storage_classes = 19;
  // The storage class of each path as the server classifies it: the one
  // set, or the one of the device holding it.
  map<string, StorageClass> effective_storage_classes = 20;
}

// StorageClass tells what reading a file of a storage costs, which decides
// how much of the media the server reads on its own.
enum StorageClass {
  // Classified by the device holding the path.
  STORAGE_CLASS_UNSPECIFIED = 0;
  // A disk of the server: reads are cheap.
  STORAGE_CLASS_LOCAL = 1;
  // A share on the local network, such as SMB or NFS: reads are slower but
  // not counted.
  STORAGE_CLASS_NETWORK = 2;
  // A cloud drive: reads count against quotas and rate limits, so the
  // server reads only what playback needs and the few bytes around it.
  STORAGE_CLASS_CLOUD = 3;
}

// VirtualEpisodes configures which episodes refreshes list as virtual
// items in series without their files. Monitored series list every
// episode, aired or not, and keep them; their specials follow specials.
message VirtualEpisodes {
  // List episodes that have aired.
  bool missing = 1;
  // List episodes airing today or later.
  bool unaired = 2;
  // List the episodes of season 0 too.
  bool specials = 3;
  // Keep virtual episodes for this many days after they air when missing
  // is off, for their files to arrive.
  int32 grace_days = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3650
  }];
}

// HubKind is a kind of hub: a row of items on Home or on a library's
// Recommended tab, each a reason to watch something.
enum HubKind {
  HUB_KIND_UNSPECIFIED = 0;
  // The items being watched and the next episodes, by last activity.
  // On Home it spans the libraries.
  HUB_KIND_CONTINUE_WATCHING = 1;
  HUB_KIND_RECENTLY_ADDED = 2;
  // Items by release date.
  HUB_KIND_RECENTLY_RELEASED = 3;
  // Episodes by air date.
  HUB_KIND_RECENTLY_AIRED = 4;
  HUB_KIND_TOP_RATED = 5;
  // The best rated items the user has not played.
  HUB_KIND_TOP_UNPLAYED = 6;
  // The series the user has not begun.
  HUB_KIND_START_WATCHING = 7;
  // What the user played long ago: items last played over a year ago,
  // series last watched over half a year ago.
  HUB_KIND_REDISCOVER = 8;
  // The seeded hubs: items like one the user played lately or likes, and
  // items of a genre, actor or director of what they played lately.
  HUB_KIND_BECAUSE_YOU_WATCHED = 9;
  HUB_KIND_BECAUSE_YOU_LIKE = 10;
  HUB_KIND_MORE_IN_GENRE = 11;
  HUB_KIND_STARRING = 12;
  HUB_KIND_DIRECTED_BY = 13;
  // The items the user requested that became available; Home only.
  HUB_KIND_AVAILABLE_REQUESTS = 14;
  // The trending titles of discovery the server lacks; Home only.
  HUB_KIND_TRENDING = 15;
}

// LibraryHubs are the hubs an administrator chose for a library, in
// order. An unset list keeps the defaults of the library's kind; an empty
// one shows none. Continue watching on Home spans the libraries and is not
// among a library's Home hubs.
message LibraryHubs {
  HubList home = 1;
  HubList recommended = 2;
}

// HubList lists hub kinds in order.
message HubList {
  repeated HubKind kinds = 1 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// ProviderOrder names the providers a library uses of each capability.
// An unset list uses every provider, in plugin ID order; an empty one
// uses none.
message ProviderOrder {
  ProviderList metadata = 1;
  ProviderList images = 2;
  ProviderList subtitles = 3;
  ProviderList lyrics = 4;
  ProviderList segments = 5;
  // Episode listers; the first that knows a series lists its episodes.
  ProviderList episodes = 6;
}

// ProviderList names providers by plugin ID, in the order they are asked.
message ProviderList {
  repeated string plugin_ids = 1 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  }];
}

// LibrarySpec holds the client-settable fields of a library.
message LibrarySpec {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    }
  ];
  LibraryKind kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  repeated string paths = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  google.protobuf.Duration scan_interval = 4 [(buf.validate.field).duration.gte = {}];
  string preferred_language = 5 [(buf.validate.field).string.pattern = "^([a-z]{2})?$"];
  string metadata_country = 6 [(buf.validate.field).string.pattern = "^([A-Z]{2})?$"];
  bool save_local_metadata = 7;
  bool auto_collections = 8;
  bool extract_trickplay = 9;
  bool extract_chapter_images = 10;
  bool analyze_loudness = 11;
  bool download_lyrics = 12;
  ProviderOrder provider_order = 13;
  VirtualEpisodes virtual_episodes = 14;
  LibraryHubs hubs = 15;
  // Storage classes by path, for paths the device would misclassify. Each
  // key must be one of paths.
  map<string, StorageClass> storage_classes = 16 [(buf.validate.field).map = {
    max_pairs: 64
    values: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

message ListLibrariesRequest {}

message ListLibrariesResponse {
  repeated Library libraries = 1;
}

message GetLibraryRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetLibraryResponse {
  Library library = 1;
}

message CreateLibraryRequest {
  LibrarySpec spec = 1 [(buf.validate.field).required = true];
}

message CreateLibraryResponse {
  Library library = 1;
}

message UpdateLibraryRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  LibrarySpec spec = 2 [(buf.validate.field).required = true];
}

message UpdateLibraryResponse {
  Library library = 1;
}

message DeleteLibraryRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message DeleteLibraryResponse {}

message ScanLibraryRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message ScanLibraryResponse {
  string job_id = 1;
  // False when a scan was already pending.
  bool enqueued = 2;
}
