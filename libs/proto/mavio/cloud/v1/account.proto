edition = "2023";

package mavio.cloud.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mavio/cloud/v1/cloud.proto";

// AccountService is mavio.dev's API for signed-in accounts
// (docs/accounts.md §3, docs/mavio-dev.md §2): their servers, sign-in
// assertions, claim codes, and the library access records an
// administrator grants and an account accepts. Requests carry the
// account's mavio.dev session: the website's cookie, or the access token
// of a device's session (docs/mavio-dev.md §2) as a bearer token.
service AccountService {
  // GetAccount gives the signed-in account.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ReportCompromised ends every mavio.dev session of the account and has
  // its servers end its sessions too.
  rpc ReportCompromised(ReportCompromisedRequest) returns (ReportCompromisedResponse);
  // CreateClaimCode gives a code that claims a server for the account
  // (ServerService.ClaimServer), valid for ten minutes.
  rpc CreateClaimCode(CreateClaimCodeRequest) returns (CreateClaimCodeResponse);
  // ListServers gives the servers the account administers or has access
  // to.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RemoveServer removes a server the account administers from mavio.dev,
  // with its access records; the server itself is unchanged
  // (docs/accounts.md §2.1).
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
  // CreateAssertion gives a sign-in assertion of the account for one of
  // its servers and the device that signs in (docs/accounts.md §5.5). A
  // server the account neither administers nor has access to is
  // PERMISSION_DENIED.
  rpc CreateAssertion(CreateAssertionRequest) returns (CreateAssertionResponse);
  // CreateAuthorizationCode approves a web UI signing the account in
  // (docs/accounts.md §6): the code it gives, sent back to the redirect
  // URI, is exchanged within a minute at /api/oauth/token with the PKCE
  // verifier for a session of the device key. A server's web UI signs in
  // only the server's administrator, and other accounts are
  // PERMISSION_DENIED; app.mavio.dev signs in any account.
  rpc CreateAuthorizationCode(CreateAuthorizationCodeRequest) returns (CreateAuthorizationCodeResponse);
  // GetClaimRequest gives the server and the web UI of a claim request
  // for the account to confirm.
  rpc GetClaimRequest(GetClaimRequestRequest) returns (GetClaimRequestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AnswerClaimRequest confirms a claim request, claiming its server for
  // the account, or declines it, and gives the URL the browser goes to
  // next: the request's redirect URI with an authorization code, or with
  // an error. An unknown, answered or expired request is NOT_FOUND.
  rpc AnswerClaimRequest(AnswerClaimRequestRequest) returns (AnswerClaimRequestResponse);
  // GetLinkCode gives what the device showing a code at mavio.dev/link
  // signs in to. An unknown or expired code is NOT_FOUND.
  rpc GetLinkCode(GetLinkCodeRequest) returns (GetLinkCodeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AnswerLinkCode signs the device showing a code in to the account, or
  // refuses it. A server's web UI signs in only the server's
  // administrator, and other accounts are PERMISSION_DENIED.
  rpc AnswerLinkCode(AnswerLinkCodeRequest) returns (AnswerLinkCodeResponse);
  // CreateRelayTicket gives the name a client reaches one of the
  // account's servers at through the relay of the server's region
  // (docs/mavio-dev.md §5), valid for a few minutes. A server the account
  // has no access to is PERMISSION_DENIED; one keeping no relay
  // connection is FAILED_PRECONDITION, as is a viewer without an
  // effective Mavio Pass whose server's administrator has none either.
  rpc CreateRelayTicket(CreateRelayTicketRequest) returns (CreateRelayTicketResponse);
  // ListAccess gives the access records of a server the account
  // administers, invitations included.
  rpc ListAccess(ListAccessRequest) returns (ListAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GrantAccess gives an account access to a server the caller
  // administers, or changes its record. A new record is an invitation
  // until the account accepts it.
  rpc GrantAccess(GrantAccessRequest) returns (GrantAccessResponse);
  // RevokeAccess removes an account's record from a server the caller
  // administers, or withdraws its invitation.
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse);
  // ListInvitations gives the account's invitations.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // AcceptInvitation makes an invitation's record take effect.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  // DeclineInvitation removes an invitation.
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse);
  // LeaveServer removes the account's own record from a server.
  rpc LeaveServer(LeaveServerRequest) returns (LeaveServerResponse);
}

// Server is a claimed server as its administrator and members see it.
message Server {
  // The fingerprint of the identity key (docs/accounts.md §5.1).
  string id = 1;
  // The Ed25519 identity public key, which clients check when they
  // connect.
  bytes public_key = 2;
  string name = 3;
  string version = 4;
  // The administrator.
  Account administrator = 5;
  // The account's access; unset for the administrator.
  Access access = 6;
  // The libraries the server published.
  repeated Library libraries = 7;
  google.protobuf.Timestamp claim_time = 8;
  // The URLs the server published, best first.
  repeated string connections = 9;
}

// AccessRecord is an account's library access record on a server.
message AccessRecord {
  Account account = 1;
  Access access = 2;
  // Whether the account has not accepted it yet.
  bool invitation = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
}

// Invitation is a server's access record the account has not accepted.
message Invitation {
  string server_id = 1;
  string server_name = 2;
  Account administrator = 3;
  Access access = 4;
  google.protobuf.Timestamp create_time = 5;
}

message GetAccountRequest {}

message GetAccountResponse {
  Account account = 1;
  // Empty on managed accounts.
  string email = 2;
  // When the account's own Mavio Pass ends; unset without one.
  google.protobuf.Timestamp pass_expire_time = 3;
  // Whether the account has an effective Mavio Pass: its own, or its Home
  // administrator's while the Home is not frozen.
  bool effective_pass = 4;
  // Whether switching to the account needs a PIN.
  bool has_pin = 5;
}

message ReportCompromisedRequest {}

message ReportCompromisedResponse {}

message CreateClaimCodeRequest {}

message CreateClaimCodeResponse {
  string claim_code = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message RemoveServerRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message RemoveServerResponse {}

message CreateAssertionRequest {
  string server_id = 1 [(buf.validate.field).required = true];
  // The Ed25519 public key of the device that signs in.
  bytes device_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
}

message CreateAssertionResponse {
  string assertion = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message CreateAuthorizationCodeRequest {
  // The server whose web UI signs in; empty for app.mavio.dev.
  string server_id = 1;
  // Where the web interface receives the code: an HTTP or HTTPS URL.
  string redirect_uri = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
  // The S256 PKCE challenge: the base64url SHA-256 of the verifier.
  string code_challenge = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 43
  ];
  // The Ed25519 public key of the device that signs in.
  bytes device_key = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
}

message CreateAuthorizationCodeResponse {
  string code = 1;
}

message GetClaimRequestRequest {
  string claim_request = 1 [(buf.validate.field).required = true];
}

message GetClaimRequestResponse {
  string server_id = 1;
  string server_name = 2;
  // The redirect URI of the web UI that started the claim.
  string redirect_uri = 3;
  // Whether the server is claimed now, by this account or another.
  bool claimed = 4;
  google.protobuf.Timestamp expire_time = 5;
}

message AnswerClaimRequestRequest {
  string claim_request = 1 [(buf.validate.field).required = true];
  bool confirm = 2;
}

message AnswerClaimRequestResponse {
  // Where the browser goes next.
  string redirect_url = 1;
}

message GetLinkCodeRequest {
  string user_code = 1 [(buf.validate.field).required = true];
}

message GetLinkCodeResponse {
  // The server whose web UI shows the code; empty for app.mavio.dev and
  // Mavio's apps.
  string server_id = 1;
  string server_name = 2;
  // The client's ID: a server's ID, "app", or an app's reverse-DNS ID.
  string client_id = 3;
}

message AnswerLinkCodeRequest {
  string user_code = 1 [(buf.validate.field).required = true];
  bool approve = 2;
}

message AnswerLinkCodeResponse {}

message CreateRelayTicketRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message CreateRelayTicketResponse {
  // relay-<region>-<ticket>.<ID>.mavio.site, the TLS server name and DNS
  // name of the connection.
  string host = 1;
  // The ticket admits new connections until then; open ones stay.
  google.protobuf.Timestamp expire_time = 2;
}

message ListAccessRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message ListAccessResponse {
  repeated AccessRecord records = 1;
}

message GrantAccessRequest {
  string server_id = 1 [(buf.validate.field).required = true];
  // The account, by user name.
  string user_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  Access access = 3 [(buf.validate.field).required = true];
}

message GrantAccessResponse {
  AccessRecord record = 1;
}

message RevokeAccessRequest {
  string server_id = 1 [(buf.validate.field).required = true];
  string account_id = 2 [(buf.validate.field).required = true];
}

message RevokeAccessResponse {}

message ListInvitationsRequest {}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message AcceptInvitationRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message AcceptInvitationResponse {}

message DeclineInvitationRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message DeclineInvitationResponse {}

message LeaveServerRequest {
  string server_id = 1 [(buf.validate.field).required = true];
}

message LeaveServerResponse {}
