edition = "2023";

package mavio.cloud.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mavio/user/v1/user.proto";

// ServerService is mavio.dev's API for servers in mavio.dev mode
// (docs/accounts.md §3.2, docs/mavio-dev.md §3). Every request is
// authenticated by a JWT the server signs with its identity key
// (private_key_jwt): EdDSA, with the server's ID as its kid, iss and sub,
// mavio.dev's API base URL as its aud, a random jti, and an expiry at
// most a minute after it was issued, carried as a bearer token. Claiming
// registers the key; the other methods need a claimed server.
service ServerService {
  // ClaimServer registers the server under the account that created the
  // claim code at mavio.dev/claim, which becomes its administrator. An
  // unknown, used or expired code fails with INVALID_ARGUMENT. Claiming a
  // server again, after its command line unclaimed it, keeps its changes.
  rpc ClaimServer(ClaimServerRequest) returns (ClaimServerResponse);
  // ListChanges gives the server's changes after a cursor, oldest first.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PublishLibraries replaces the libraries mavio.dev knows of the
  // server, which access records name, so that administrators edit access
  // from anywhere.
  rpc PublishLibraries(PublishLibrariesRequest) returns (PublishLibrariesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // SetAcmeChallenge publishes the TXT values of the server's ACME DNS-01
  // challenge at <ID>.acme.mavio.dev, the target of
  // _acme-challenge.<ID>.mavio.site, replacing earlier ones
  // (docs/mavio-dev.md §4.2).
  rpc SetAcmeChallenge(SetAcmeChallengeRequest) returns (SetAcmeChallengeResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ClearAcmeChallenge removes the TXT values once the challenge is done.
  rpc ClearAcmeChallenge(ClearAcmeChallengeRequest) returns (ClearAcmeChallengeResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // CreateAcmeBinding gives an external account binding, which a
  // certificate authority requiring one, such as Google Trust Services,
  // needs to register the server's ACME account.
  rpc CreateAcmeBinding(CreateAcmeBindingRequest) returns (CreateAcmeBindingResponse);
}

// Account is a Mavio account as a server sees it.
message Account {
  // Stable and unique across mavio.dev.
  string id = 1;
  // Unique across mavio.dev, case-insensitively.
  string user_name = 2;
  string display_name = 3;
  AccountKind kind = 4;
  // A managed account's restriction profile, which applies on every server
  // on top of its access records; unspecified on full accounts.
  mavio.user.v1.RestrictionProfile restriction = 5;
}

// AccountKind is how an account signs in.
enum AccountKind {
  ACCOUNT_KIND_UNSPECIFIED = 0;
  // Signs in with its own credentials.
  ACCOUNT_KIND_FULL = 1;
  // Reached only by switching within its Home.
  ACCOUNT_KIND_MANAGED = 2;
}

// Access is an account's library access record on a server.
message Access {
  // Every library; library_ids are then empty.
  bool all_libraries = 1;
  // The libraries the account reaches, by the IDs the server published.
  repeated string library_ids = 2;
  // The highest rating score shown; unset shows every rating, zero only
  // content for all ages.
  int32 max_parental_rating = 3;
  // Hides items without a rating under a maximum.
  bool block_unrated = 4;
  // When set, only items with one of these labels are shown.
  repeated string allowed_labels = 5;
  // Items with any of these labels are hidden.
  repeated string blocked_labels = 6;
  bool allow_download = 7;
}

message ClaimServerRequest {
  string claim_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ];
  // The server's Ed25519 identity public key, whose fingerprint is the ID
  // in the request's JWT.
  bytes public_key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
  // The name the server shows.
  string name = 3 [(buf.validate.field).string.max_len = 128];
  string version = 4 [(buf.validate.field).string.max_len = 64];
}

message ClaimServerResponse {
  // The administrator.
  Account administrator = 1;
  // The cursor of the server's latest change; the server fetches the
  // changes after it.
  int64 cursor = 2;
}

message ListChangesRequest {
  // The cursor of the last change the server applied; zero for all.
  int64 after = 1 [(buf.validate.field).int64.gte = 0];
  // At most this many changes; mavio.dev chooses when zero.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message ListChangesResponse {
  repeated Change changes = 1;
  // Whether more changes follow the last one.
  bool more = 2;
  // The cursor to fetch after next, that of the last change; the request's
  // after when there are none.
  int64 cursor = 3;
}

// Change is one change to the server's records, applied in cursor order.
message Change {
  // Increases with every change for the server.
  int64 cursor = 1;
  google.protobuf.Timestamp create_time = 2;
  oneof kind {
    // An account has access, or its record changed.
    AccessGranted access_granted = 3;
    // An account's access was revoked.
    AccessRevoked access_revoked = 4;
    // An account's names changed.
    Account account_changed = 5;
    // An account was suspended, deleted or reported compromised.
    AccountRevoked account_revoked = 6;
  }
}

message AccessGranted {
  Account account = 1;
  Access access = 2;
}

message AccessRevoked {
  string account_id = 1;
}

message AccountRevoked {
  string account_id = 1;
  Reason reason = 2;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Its sessions end.
    REASON_SUSPENDED = 1;
    // Its user and the user's data are deleted.
    REASON_DELETED = 2;
    // Its sessions end.
    REASON_COMPROMISED = 3;
  }
}

// Library is a library of the server as mavio.dev knows it.
message Library {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.max_len = 256];
  // The library's kind, such as "movies" or "shows".
  string kind = 3 [(buf.validate.field).string.max_len = 32];
}

message PublishLibrariesRequest {
  repeated Library libraries = 1 [(buf.validate.field).repeated.max_items = 1000];
}

message PublishLibrariesResponse {}

// Notice tells a server, as a binary frame on its WebSocket connection
// at /servers/notices under mavio.dev's API base URL, that its changes
// reached a cursor. The server opens the connection with the same JWT as
// its requests.
message Notice {
  int64 cursor = 1;
}

message SetAcmeChallengeRequest {
  // The key authorizations' digests, as DNS-01 puts them in TXT records.
  repeated string values = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
    items: {
      string: {pattern: "^[A-Za-z0-9_-]{43}$"}
    }
  }];
}

message SetAcmeChallengeResponse {}

message ClearAcmeChallengeRequest {}

message ClearAcmeChallengeResponse {}

message CreateAcmeBindingRequest {}

message CreateAcmeBindingResponse {
  // The key ID and MAC key of RFC 8555's externalAccountBinding.
  string key_id = 1;
  bytes hmac_key = 2;
}
