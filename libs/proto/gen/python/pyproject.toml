[project]
name = "mavio-proto"
version = "0.0.0"
description = "Mavio's contracts: protobuf messages and Connect services"
license = "GPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = ["protobuf>=6.33,<7", "connect-python>=0.9,<0.10"]

[dependency-groups]
dev = ["protoc-gen-connect-python==0.9.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Generated by buf (libs/proto/buf.gen.yaml): namespace packages, without
# __init__.py.
module-name = ["mavio", "buf"]
namespace = true
