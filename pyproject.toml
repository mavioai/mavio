# The uv workspace of the Python projects: process plugins written in Python
# (plugins/pipecat), their SDK (libs/plugin/python) and the contracts' Python
# messages (libs/proto/gen/python). It is virtual: the root is not a package.
[tool.uv.workspace]
members = ["libs/proto/gen/python", "libs/plugin/python", "plugins/pipecat"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
# Pipecat's annotations leave type arguments out (asyncio.Task, dict).
reportUnknownMemberType = false
# The contracts' generated messages are checked as the workspace's source,
# their stubs (.pyi) beside them.
extraPaths = ["libs/proto/gen/python/src"]

[tool.ruff.lint.isort]
known-first-party = ["mavio", "mavio_pipecat", "mavio_plugin"]
