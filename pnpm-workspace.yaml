packages:
  - apps/*
  - libs/*
  - plugins/*
allowBuilds:
  '@google/genai': false
  esbuild: true
  nx: true
  protobufjs: false
  workerd: true
minimumReleaseAgeExclude:
  - style-dictionary@5.6.1
  - '@earendil-works/chord@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-durable@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
# unplugin's typings import "bun"; keep plugins/agent's Bun types out of the other packages.
hoistPattern:
  - '*'
  - '!@types/bun'
  - '!bun-types'
